  promptEl.innerHTML=`<b>▶ 再生</b>を押してリズムを聴き、同じ並びを音符で作ってください。`
    +`<span class="toollabel"> （${sig[0]}/${sig[1]}拍子 ＝ ひと小節は${barLenLabel(sig)}）</span>`;

  bodyEl.innerHTML=`
    <div class="fillmeter"><i id="fmeter"></i></div>
    <div class="remainbeats" id="remainBeats"></div>
    <div class="tray" id="tray"><span class="empty">ここに音符を並べます</span></div>
    <div class="palette" id="palette"></div>`;

  const palette=$('palette');
  // パレット候補：出題プールの音価をひととおり提示（重複は除く）
  const palKeys = pool.filter((v,i,a)=>a.indexOf(v)===i);
  shuffle(palKeys).forEach(k=>{
    const b=document.createElement('button'); b.className='opt';
    b.style.flex='0 0 auto';
    b.innerHTML=noteGlyph(k,{w:28,h:38})+`<span style="font-size:12px">${DUR[k].short}</span>`;
    b.onclick=()=>addToTray(k);
    palette.appendChild(b);
  });

  ctrlEl.innerHTML='';
  const play=mkBtn('▶ 再生','ghost',()=>{
    if(S.data.playing) return;          // カウント〜再生中の多重押し防止
    S.data.playing=true;
    play.disabled=true;
    const counter=makeCountLayer();
    playSequence(S.data.answer, S.data.bpm, {
      accentFirst:true,
      countIn:S.data.countN,            // 拍子ぶんのカウントイン（4/4なら4、6/8なら2）
      countUnitTick:S.data.countUnit,   // 6/8は付点四分ごとにカウント
      onCount:(n,isGo)=>counter.show(n,isGo),
      onEnd:()=>{ S.data.playing=false; play.disabled=false; }
    });
  });
  const clr=mkBtn('やり直し','sub',()=>{ S.data.placed=[]; renderTray(); });
  const chk=mkBtn('答え合わせ','',()=>gradeListen());
  chk.id='listenCheck';
  // 上段＝何度でも押せる操作（聴く・直す）、下段＝決定。役割で段を分ける。
  ctrlEl.classList.add('stack');
  const sub=document.createElement('div'); sub.className='subrow';
  sub.append(play, clr);
  ctrlEl.append(sub, chk);
  renderTray();
}
function addToTray(k){
  if(S.locked) return;
  const cur=S.data.placed.reduce((s,x)=>s+DUR[x].tick,0);
  if(cur+DUR[k].tick>S.data.target){ flashMeter(); return; }
  S.data.placed.push(k); renderTray();
}
function renderTray(){
  const tray=$('tray'); if(!tray) return;
  const p=S.data.placed;
  tray.onclick=null;
  if(!p.length){
    // 音符が0個でも、拍子記号と拍のガイドが見える空の五線を出す。
    // 「1小節がどれだけの長さか」を最初から目で確かめられるようにするため。
    tray.innerHTML=`<div class="traystaff">${staffSVG([],{totalTick:S.data.target, meterSig:S.data.meterSig||null})}</div>`
      +`<div class="traytip">下の音符を えらんで、この1小節を うめましょう</div>`;
  }
  else{
    // 連桁付きの五線譜で表示（並べた音符がつながる）。タップで最後の音符を取り消し。
    const seq=p.map(k=>({key:k,tick:DUR[k].tick}));
    const tot=Math.max(S.data.target, seq.reduce((s,n)=>s+n.tick,0));
    tray.innerHTML=`<div class="traystaff">${staffSVG(seq,{totalTick:tot, meterSig:S.data.meterSig||null, beam:true})}</div>`
      +`<div class="traytip">タップで さいごの音符を とりけし</div>`;
    tray.onclick=()=>{ if(S.locked)return; if(S.data.placed.length){ S.data.placed.pop(); renderTray(); } };
  }
  const cur=p.reduce((s,x)=>s+DUR[x].tick,0);
  const m=$('fmeter'); if(m) m.style.width=Math.min(100,cur/S.data.target*100)+'%';
  // 1小節が埋まるまで答え合わせは押せない。押せない理由が分かるよう残りを示す。
  const full = cur===S.data.target;
  const chk=$('listenCheck'); if(chk && !S.locked) chk.disabled=!full;
  const rb=$('remainBeats');
  if(rb){
    rb.className='remainbeats'+(full?' full':'');
    rb.textContent = full ? 'ひと小節ぶん そろいました' : `のこり ${beatStr(S.data.target-cur)}`;
  }
}
function flashMeter(){ const m=$('fmeter'); if(!m)return; m.style.background='var(--bad)'; setTimeout(()=>m.style.background='var(--accent)',250); }
function gradeListen(){
  if(S.locked) return;
  const a=S.data.answer, p=S.data.placed;
  const sameLen=a.length===p.length;
  const ok = sameLen && a.every((k,i)=>DUR[k].tick===DUR[p[i]].tick);
  S.locked=true; score(ok);
  const ansSeq=a.map(k=>({key:k,tick:DUR[k].tick, mark: ok?'ok':'ng'}));
  const _wrap=document.createElement('div');
  const _sig=S.data.sig||null;
  _wrap.innerHTML=`<div class="stage" style="margin-bottom:6px">${staffSVG(ansSeq,{totalTick:S.data.target,meterSig:_sig,beam:true,tie:canTie(_sig)})}</div>`;
  bodyEl.insertAdjacentElement('afterbegin', _wrap);
  if(ok) showFB(true,'完全一致','耳と手がつながりました');
  else showFB(false,'', 'これが正解のリズムです。もう一度聴き比べを');
  celebrate(ok);
  nextBtn();
  // 聴き直しは操作行に置く。譜面の中と操作行の2か所に再生ボタンが出るのを避ける。
  ctrlEl.classList.remove('stack'); ctrlEl.classList.add('split');
  const _pbtn=mkBtn('▶ 答えを聴く','ghost',()=>{
    _pbtn.disabled=true;
    playStaffBar(ansSeq, 84, _wrap, ()=>{ _pbtn.disabled=false; });
  });
  ctrlEl.insertAdjacentElement('afterbegin', _pbtn);
}

/* ============================================================
   ⑤ 音価てんびん：2つの音価を比較（タブ表示は⑤）
============================================================ */
/* 出題ステージ（0-based の問番号→課題の型）。
   単音の比較 → 合計の比較 → 付点 → 同価異表記 → 複雑な組み合わせ、と体系的に難化させる。 */
function scaleStage(i){
  if(isMixedDaily()) i = 4;
  if(i<=0) return {kind:'single', pool:['whole','half','quarter','eighth']};
  if(i<=1) return {kind:'sum',    pool:['half','quarter','eighth']};
  if(i<=2) return {kind:'dot',    pool:['dotHalf','half','dotQuarter','quarter','eighth']};
  if(i<=3) return {kind:'equiv',  pool:['half','quarter','eighth','sixteenth']};
  return   {kind:'mix',   pool:['dotHalf','half','dotQuarter','quarter','dotEighth','eighth','sixteenth']};
}
// 同価の並びを1音だけ差し替え、「そっくりに見えるが長さは違う」ひっかけを作る
function perturbGroup(g, pool){
  if(!g || !g.length) return g;
  const i=Math.floor(Math.random()*g.length);
  const cands=pool.filter(k=>DUR[k].tick!==DUR[g[i]].tick);
  if(!cands.length) return g;
  const out=g.slice(); out[i]=rnd(cands); return out;
}
function mScale(){
  modeHeader();
  if(SESS && SESS.todayDone){ renderDailyDone(SESS.dailyId); return; }
  const qi = (SESS && SESS.i!=null) ? SESS.i : 0;
  const st = scaleStage(qi);
  const sum=g=>g.reduce((s,k)=>s+DUR[k].tick,0);
  const pick=(pool,n)=>{ const a=[]; for(let i=0;i<n;i++) a.push(rnd(pool)); return a; };
  const pair = uniqueGen('scale', ()=>{
    let a, b, t=0;
    if(st.kind==='single'){
      // ①単音どうし：長さの差がはっきり分かるところから
      a=[rnd(st.pool)];
      do{ b=[rnd(st.pool)]; }while(DUR[b[0]].tick===DUR[a[0]].tick && ++t<20);
    }else if(st.kind==='sum'){
      // ②1つ 対 2つ：合計して比べる感覚を作る
      do{ a=pick(st.pool,1); b=pick(st.pool,2); }while(sum(a)===sum(b) && ++t<20);
    }else if(st.kind==='dot'){
      // ③付点をふくむ比較：1.5倍の感覚を確かめる
      do{ a=[rnd(['dotHalf','dotQuarter','dotEighth'])]; b=pick(st.pool, rnd([1,2])); }while(sum(a)===sum(b) && ++t<20);
    }else if(st.kind==='equiv'){
      // ④同価異表記：見た目が違っても同じ長さ。4割は「そっくりだが違う」ひっかけ
      a=pick(st.pool, rnd([1,2]));
      b=makeEquivalent(sum(a));
      if(Math.random()<0.4) b=perturbGroup(b, st.pool);
    }else{
      // ⑤複雑な組み合わせ：3割は同価、残りは自由な組み合わせ
      a=pick(st.pool, rnd([1,2,2,3]));
      b=(Math.random()<0.3) ? makeEquivalent(sum(a)) : pick(st.pool, rnd([1,2,3]));
    }
    if(Math.random()<0.5){ const tmp=a; a=b; b=tmp; }   // 左右どちらに正解が来るかを均す
    return {a,b};
  }, r=>r.a.join('-')+'|'+r.b.join('-'));
  const A=pair.a, B=pair.b;
  const sa=sum(A), sb=sum(B);
  const rel = sa>sb?'left':sa<sb?'right':'equal';
  // 答え合わせで見せる内訳（足し算の式）
  const brk = g => g.length>1
    ? g.map(k=>beatStr(DUR[k].tick)).join(' ＋ ')+' ＝ '+beatStr(sum(g))
    : beatStr(sum(g));

  promptEl.innerHTML=`左と右、<b>長い</b>のはどちら？`;
  bodyEl.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:4px">
      ${sidePanel('左',A)}
      <div class="balance" id="balance"><div class="scale">⚖</div><div class="cap">てんびん</div></div>
      ${sidePanel('右',B)}
    </div>`;

  const opts=[['left','← 左が長い'],['equal','＝ 同じ'],['right','右が長い →']];
  const box=document.createElement('div'); box.className='choices cols3';
  opts.forEach(([v,l],i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="num">${i+1}</span><span style="font-size:13px">${l}</span>`;
    b.onclick=()=>{
      if(S.locked)return; S.locked=true;
      const ok=v===rel;
      Array.from(box.children).forEach((c,j)=>{
        if(opts[j][0]===rel)c.classList.add('correct');
        else if(j===i)c.classList.add('wrong'); else c.classList.add('dim');
      });
      score(ok);
      showFB(ok,'', `左 ${brk(A)}　／　右 ${brk(B)}`);
      // てんびんは「ゆれる → 長いほうへ傾く」の順で動かし、比較の過程を見せる
      const bal=$('balance');
      if(bal){
        const sc=bal.querySelector('.scale');
        bal.classList.remove('tilt-left','tilt-right');
        if(sc){ sc.classList.remove('swing'); void sc.offsetWidth; sc.classList.add('swing'); }
        setTimeout(()=>{
          if(rel==='left') bal.classList.add('tilt-left');
          else if(rel==='right') bal.classList.add('tilt-right');
        }, 260);
      }
      // 回答後にバーを左端揃えで並べて比較表示
      showBarCompare(sa, sb, rel);
    };
    box.appendChild(b);
  });
  bodyEl.appendChild(box);
  nextBtn();
}
// 回答後：左右の音価をバーで並べて比較（左端揃え・棒グラフ的）
function showBarCompare(sa, sb, rel){
  const maxV=Math.max(sa,sb,1);
  const pct = v => Math.max(6, (v/maxV)*100);  // 最小6%で視認性確保
  const cls = side => rel==='equal' ? 'beq' : (rel===side ? 'bwin' : 'blose');
  const shortPct = pct(Math.min(sa,sb));       // 短いほうの右端＝差の始まり
  const diffTick = Math.abs(sa-sb);
  const diffTxt = rel==='equal'
    ? 'ぴったり 同じ ながさ'
    : `${rel==='left'?'左':'右'}が ${beatStr(diffTick)} ながい`;
  const wrap=document.createElement('div');
  wrap.className='barcompare';
  wrap.innerHTML=`
    <div class="brow">
      <span class="blabel">左</span>
      <div class="btrack"><div class="bfill ${cls('left')}" style="width:0%"></div><span class="bval">${beatStr(sa)}</span><div class="bmark" style="left:${shortPct}%"></div></div>
    </div>
    <div class="brow">
      <span class="blabel">右</span>
      <div class="btrack"><div class="bfill ${cls('right')}" style="width:0%"></div><span class="bval">${beatStr(sb)}</span><div class="bmark" style="left:${shortPct}%"></div></div>
    </div>
    <div class="bnote">バーの 右はしの ズレが、ながさの ちがいです</div>
    <div class="bdiff">${diffTxt}</div>`;
  bodyEl.appendChild(wrap);
  // 次フレームで幅を伸ばし、伸びきってから差の目印と結論を出す
  requestAnimationFrame(()=>{
    const fills=wrap.querySelectorAll('.bfill');
    if(fills[0]) fills[0].style.width=pct(sa)+'%';
    if(fills[1]) fills[1].style.width=pct(sb)+'%';
  });
  setTimeout(()=>{
    if(rel!=='equal') wrap.querySelectorAll('.bmark').forEach(m=>m.classList.add('on'));
    const d=wrap.querySelector('.bdiff'); if(d) d.classList.add('on');
  }, 700);
}
function sidePanel(label,g){
  const glyphs=g.map(k=>noteGlyph(k,{w:34,h:46})).join('');
  return `<div style="text-align:center">
    <div class="toollabel" style="margin-bottom:6px">${label}</div>
    <div style="display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:3px;min-height:52px">${glyphs}</div>
  </div>`;
}
function makeEquivalent(tick){
  // tick合計に等しい別の並びを作る
  const seq=fillBar(tick, ['half','quarter','eighth','dotQuarter','sixteenth','whole','dotHalf']);
  return seq.length?seq:['quarter'];
}

/* ============================================================
   ⑥ 小節けいさつ：拍数が合っているか判定（タブ表示は⑥）
============================================================ */
/* 違反のパターン。ランダムに音符を足し引きするのではなく、
   書き譜でありがちな「意味のある間違い」を作る。 */
const POLICE_FAULTS = {
  short1:    {delta:-48, label:'1拍たりない'},
  short_half:{delta:-24, label:'半拍たりない'},
  over1:     {delta: 48, label:'1拍多い'},
  over_half: {delta: 24, label:'半拍多い'},
  dotMiss:   {dot:'miss', label:'付点の書きわすれ'},
  dotAdd:    {dot:'add',  label:'よけいな付点'},
};
// 問番号→出題ステージ（差の大きい違反から、細かい違反へ）
function policeStage(i){
  if(isMixedDaily()) return {pool:ADV_POOL, sigs:SIG_ALL(),
    faults:['short1','over1','short_half','over_half','dotMiss','dotAdd']};
  if(i<=1) return {pool:['half','quarter','quarter','eighth'], sigs:[[4,4],[3,4]],
    faults:['short1','over1']};
  if(i<=3) return {pool:['half','dotHalf','quarter','quarter','dotQuarter','eighth'], sigs:[[4,4],[3,4],[2,4]],
    faults:['short1','over1','short_half','over_half']};
  return {pool:['half','dotHalf','quarter','dotQuarter','eighth','eighth','dotEighth','sixteenth'], sigs:SIG_ALL(),
    faults:['short_half','over_half','dotMiss','dotAdd','short1']};
}
// 付点あり↔なしの対応表（書き間違いの再現に使う）
const DOT_PAIR = {half:'dotHalf', quarter:'dotQuarter', eighth:'dotEighth'};
const UNDOT = {dotHalf:'half', dotQuarter:'quarter', dotEighth:'eighth'};
// 正しい小節に「ありがちな間違い」を1つだけ加える。適用できなければ null を返す。
function applyFault(keys, fname){
  const f=POLICE_FAULTS[fname]; if(!f) return null;
  const arr=keys.slice();
  if(f.dot){
    const map = (f.dot==='miss') ? UNDOT : DOT_PAIR;
    const idxs = arr.map((k,i)=>i).filter(i=>map[arr[i]]);
    if(!idxs.length) return null;
    const i=rnd(idxs);
    const before=DUR[arr[i]].tick;
    arr[i]=map[arr[i]];
    return {seq:arr, label:f.label, delta:DUR[arr[i]].tick-before};
  }
  const d=f.delta;
  // まず「1音だけ書き替える」形で作れないか探す（もっとも自然な間違い方）
  const cands=[];
  arr.forEach((k,i)=>{
    Object.keys(DUR).forEach(k2=>{
      if(DUR[k2].tick-DUR[k].tick===d) cands.push({i,k2});
    });
  });
  if(cands.length){
    const c=rnd(cands); arr[c.i]=c.k2;
    return {seq:arr, label:f.label, delta:d};
  }
  // 書き替えで作れないときは、1音の増減で作る
  if(d<0){
    const i=arr.findIndex(k=>DUR[k].tick===-d);
    if(i>=0){ arr.splice(i,1); return {seq:arr, label:f.label, delta:d}; }
    return null;
  }
  const add=Object.keys(DUR).find(k=>DUR[k].tick===d);
  if(!add) return null;
  arr.splice(Math.floor(Math.random()*(arr.length+1)),0,add);
  return {seq:arr, label:f.label, delta:d};
}
function mPolice(){
  modeHeader();
  if(SESS && SESS.todayDone){ renderDailyDone(SESS.dailyId); return; }
  const qi = (SESS && SESS.i!=null) ? SESS.i : 0;
  const st = policeStage(qi);
  const q = uniqueGen('police', ()=>{
    const sig = rnd(st.sigs);
    const bt = barTickOf(sig);
    const base = fillBarSig(sig, st.pool);          // まず「正しい小節」を作る
    if(Math.random()<0.5) return {sig, barTick:bt, seq:base, fault:null};
    // 違反：ありがちな間違いを1つだけ加える（作れなければ合格のまま出す）
    for(const fname of shuffle(st.faults)){
      const r=applyFault(base, fname);
      if(r && r.seq.reduce((s,k)=>s+DUR[k].tick,0)!==bt) return {sig, barTick:bt, seq:r.seq, fault:r};
    }
    return {sig, barTick:bt, seq:base, fault:null};
  }, r=>r.sig.join('/')+'|'+r.seq.join('-'));

  const sig=q.sig, num=sig[0], den=sig[1], barTick=q.barTick, fault=q.fault;
  const seq=q.seq.map(k=>({key:k}));
  const sum=seq.reduce((s,n)=>s+DUR[n.key].tick,0);
  const isOK = sum===barTick;   // 実測で合否を確定
  const tieOK = canTie(sig);

  promptEl.innerHTML=`拍子は <b>${num}/${den}</b>。この小節は拍数が正しい？ <span class="toollabel">（1小節＝${barLenLabel(sig)}）</span>`;
  const showSeq=seq.map(n=>({key:n.key,tick:DUR[n.key].tick,rest:!!n.rest}));
  bodyEl.innerHTML=`<div class="stage">${staffSVG(showSeq,{totalTick:Math.max(sum,barTick),meterSig:sig,beam:true})}</div>`;

  const opts=[['ok','◎ 合格（ちょうど）'],['ng','✕ 違反（過不足あり）']];
  const box=document.createElement('div'); box.className='choices cols2';
  opts.forEach(([v,l],i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="num">${i+1}</span><span style="font-size:13px">${l}</span>`;
    b.onclick=()=>{
      if(S.locked)return; S.locked=true;
      const ansV=isOK?'ok':'ng';
      const ok=v===ansV;
      Array.from(box.children).forEach((c,j)=>{
        if(opts[j][0]===ansV)c.classList.add('correct');
        else if(j===i)c.classList.add('wrong'); else c.classList.add('dim');
      });
      // 譜面に判定色（超過小節は、はみ出した音符だけを赤に）
      let acc2=0;
      const marked=seq.map(n=>{
        acc2+=DUR[n.key].tick;
        let mark = isOK?'ok':'ng';
        if(!isOK && sum>barTick){ mark = (acc2>barTick)?'ng':undefined; }
        return {key:n.key,tick:DUR[n.key].tick,rest:!!n.rest,mark};
      });
      const _stageEl=$('body').querySelector('.stage');
      _stageEl.innerHTML=staffSVG(marked,{totalTick:Math.max(sum,barTick), barTick, meterSig:sig, beam:true, tie:tieOK});
      // ▶再生（判定後の譜面をそのまま全部・♩=84・等速バー＋ハイライト。合格・違反どちらでも）
      const _pbtn=mkBtn('▶ 再生','accent',()=>{ _pbtn.disabled=true; playStaffBar(marked, 84, bodyEl, ()=>{ _pbtn.disabled=false; }); });
      const _pw=document.createElement('div'); _pw.style.cssText='text-align:center;margin:6px 0 10px'; _pw.appendChild(_pbtn);
      _stageEl.insertAdjacentElement('afterend', _pw);
      score(ok);
      const diff=sum-barTick;
      const detail = diff===0?'ちょうど'+barLenLabel(sig):(diff>0?`${beatStr(diff)}オーバー`:`${beatStr(-diff)}不足`);
      const why = fault ? `　— ${fault.label}` : '';
      showFB(ok, isOK?'合格':'違反', `合計 ${beatStr(sum)}（${detail}）${why}`);
    };
    box.appendChild(b);
  });
  bodyEl.appendChild(box);
  nextBtn();
}

// カウントインのオーバーレイを用意し、show(n,isGo) で数字を更新するハンドラを返す
function makeCountLayer(){
  const card=$('stageCard'); if(!card) return {show(){},clear(){}};
  const old=card.querySelector('.countin'); if(old) old.remove();
  const layer=document.createElement('div'); layer.className='countin';
  const span=document.createElement('div'); span.className='cnum';
  layer.appendChild(span);
  card.appendChild(layer);
  return {
    show(n, isGo){
      if(!layer.parentNode) return;
      if(isGo){
        span.className='cgo'; span.textContent='スタート！';
        setTimeout(()=>{ if(layer.parentNode) layer.remove(); }, 420);
      }else{
        span.textContent=String(n);
        // reflowでポップアニメーションを毎拍やり直す
        span.className='cnum'; void span.offsetWidth; span.className='cnum beat';
      }
    },
    clear(){ if(layer.parentNode) layer.remove(); }
  };
}

  ※ 単一HTML・オフライン動作を保つため、外部URLではなく必ずデータURIで埋め込みます。
*/
const CELEBRATE_IMG = ""; // ← ここに正解イラストのデータURIを貼り付け

function celebrate(ok){
  const card=$('stageCard'); if(!card) return;
  // 既存の演出があれば消す
  const old=card.querySelector('.celebrate'); if(old) old.remove();

  const layer=document.createElement('div');
  layer.className='celebrate '+(ok?'ok':'ng');

  const flash=document.createElement('div'); flash.className='flash';
  layer.appendChild(flash);

  const hero=document.createElement('div'); hero.className='hero';
  if(ok){
    const art = CELEBRATE_IMG
      ? `<div class="heroArt"><img src="${CELEBRATE_IMG}" alt="正解イラスト"></div>`
      : `<div class="heroArt">🎉</div>`;
    hero.innerHTML = `${art}<div class="heroTxt">せいかい！</div>`;
  }else{
    hero.innerHTML = `<div class="heroX">✕</div>`;
  }
  layer.appendChild(hero);

  // 紙吹雪（正解時のみ）
  if(ok){
    const colors=['#c0472b','#2f7d5b','#b08833','#3a4a63','#d98a3d','#5b8def'];
    const N=44, W=card.clientWidth, H=card.clientHeight;
    for(let i=0;i<N;i++){
      const c=document.createElement('div'); c.className='confetti';
      const x=Math.random()*W;
      const fall=(H*0.7+Math.random()*H*0.5).toFixed(0)+'px';
      const spin=(Math.random()*720-360).toFixed(0)+'deg';
      const dur=(0.9+Math.random()*0.8).toFixed(2);
      const delay=(Math.random()*0.25).toFixed(2);
      c.style.left=x+'px';
      c.style.background=colors[i%colors.length];
      c.style.setProperty('--fall',fall);
      c.style.setProperty('--spin',spin);
      c.style.animationDuration=dur+'s';
      c.style.animationDelay=delay+'s';
      if(Math.random()<0.4){ c.style.width='7px'; c.style.height='7px'; c.style.borderRadius='50%'; }
      layer.appendChild(c);
    }
  }

  card.appendChild(layer);
  // 中央の合図はふわっと消す（背景の譜面・結果表示は残る）
  const holdMs = ok?1050:750;
  setTimeout(()=>{ hero.classList.add('fade'); }, holdMs);
  setTimeout(()=>{ if(layer.parentNode) layer.remove(); }, holdMs+520);
}

/* ============================================================
   共通ボタン
============================================================ */
function mkBtn(label,cls,fn){
  const b=document.createElement('button');
  b.className='btn'+(cls?' '+cls:''); b.textContent=label; b.onclick=fn; return b;
}
function nextBtn(){
  // セッション中は「回答後」にのみ進行ボタンを出す（出題直後の呼び出しでは何も描かない）
  if(SESS && SESS.active){
    if(!SESS.answered){ ctrlEl.innerHTML=''; return; }
    renderSessionNext();
    return;
  }
  // 非セッション（保険）：従来どおり
  ctrlEl.innerHTML='';
  const n=mkBtn('つぎの問題 →','',()=>loadMode());
  n.classList.add('wide');
  ctrlEl.appendChild(n);
}

   起動
============================================================ */
// 最初のユーザー操作で AudioContext を起こす（iOS対策）
document.body.addEventListener('touchstart',()=>audio(),{once:true,passive:true});
document.body.addEventListener('mousedown',()=>audio(),{once:true});

(function(){ const t=$('tabToggle'); if(t) t.onclick=()=>{ tabsOpen=!tabsOpen; applyTabState(); }; })();
buildTabs();
sessionStart();
loadMode();
updHUD();

/* ---- 検証用：フッターを素早く5回タップで「本日のデイリー」をリセット ---- */
(function(){
  const f=document.querySelector('footer'); if(!f) return;
  let taps=0, timer=null;
  const hit=()=>{
    taps++;
    clearTimeout(timer); timer=setTimeout(()=>{ taps=0; }, 1500);
    if(taps>=5){
      taps=0;
      try{ for(const id in DAILY_KEYS){ localStorage.removeItem(DAILY_KEYS[id]); DAILIES[id]={}; } }catch(e){}
      if(MODES[S.mode]&&MODES[S.mode].daily){ sessionStart(); }
      f.textContent='（デイリーをリセットしました）';
      setTimeout(()=>{ f.textContent='百合ヶ丘ギター教室 SingingBirds ／ オフライン動作・単一ファイル'; }, 1400);
      if(MODES[S.mode]&&MODES[S.mode].daily) loadMode();
    }
  };
  f.style.cursor='pointer';
  f.addEventListener('click', hit);
})();
</script>
