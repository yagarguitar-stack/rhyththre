<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>リズトレ — 音価トレーナー</title>
<style>
  :root{
    /* ==== ことり二羽・こども基調（あたたかクリーム × サザナミ緑） ==== */
    --paper:#fdf6ea;        /* 背景クリーム */
    --paper2:#fbeed6;       /* ヘッダ地・帯 */
    --card:#ffffff;
    --ink:#3a2f26;          /* 文字・音符（やわらか黒茶） */
    --stave:#6b5d50;        /* 五線・準主役 */
    --muted:#8b7c64;        /* ラベル・補助（クリーム地で読めるよう一段濃く） */
    --line:#ecdcc2;         /* 枠線 */
    --line2:#f3e7d1;        /* 薄い区切り */
    --accent:#F3A63B;       /* アンバー・拍のアクセント */
    --accent-deep:#C9781A;  /* 濃アンバー（選択文字） */
    --accent-soft:#fff4e0;  /* 薄アンバー背景 */
    --good:#3AAE6E;         /* サザナミ緑 */
    --good-soft:#e4f6ec;
    --bad:#E4726B;          /* やわらか赤 */
    --bad-soft:#fce7e5;
    --bar-fill:#4C93C8;     /* 音価バー・そらいろ */
    --gold:#D68A2E;         /* 連続表示 */
    --sky:#8FC7E8;          /* 白ことり系アクセント */
    --sky-soft:#e7f4fb;
    --star:#F6C445;         /* 星 */
    --shadow:0 2px 6px rgba(120,80,20,.06),0 8px 22px rgba(120,80,20,.07);
    --radius:18px;
    --sans:'Helvetica Neue',system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --serif:var(--sans);
    --round:'Hiragino Maru Gothic ProN','Yu Gothic',var(--sans); /* こども向け丸ゴシック志向 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    padding:0 0 40px;
  }
  .wrap{max-width:420px;margin:0 auto;padding:0 14px;}

  /* ---- header（小鳥枠＋タイトル） ---- */
  header{padding:16px 0 4px;text-align:center;}
  h1{
    font-family:var(--sans);font-weight:700;font-size:1.25rem;margin:0;
    color:var(--accent);letter-spacing:.18em;
  }
  .sub{color:var(--muted);font-size:12px;margin:5px 0 0;letter-spacing:.06em;}
  /* ==== ことり二羽ステージ ==== */
  .birdstage{
    width:min(390px,94vw);margin:10px auto 2px;position:relative;
    display:flex;flex-direction:column;align-items:center;
  }
  .birds{display:flex;justify-content:center;align-items:flex-end;gap:10px;}
  .bird{width:88px;height:auto;transform-origin:50% 100%;transition:transform .2s;}
  .bird .eye{transition:transform .12s;}
  /* 先生イラスト（1枚仕様・角丸フレーム） */
  #birdGreen.sensei{width:min(376px,92vw);height:250px;object-fit:fill;border-radius:18px;border:3px solid var(--good);box-shadow:0 5px 16px rgba(0,0,0,.15);}
  /* 待機：ふわふわ上下（二羽で位相をずらす） */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  #birdGreen{animation:bob 2.6s ease-in-out infinite;}
  #birdWhite{animation:bob 2.6s ease-in-out infinite .9s;}
  /* 正解：ぴょんと跳ねる */
  @keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.06)}55%{transform:translateY(0) scale(.97)}75%{transform:translateY(-6px)}100%{transform:translateY(0) scale(1)}}
  .bird.happy{animation:hop .6s ease;}
  /* 不正解：しょんぼり傾く */
  @keyframes tilt{0%{transform:rotate(0)}30%{transform:rotate(-7deg) translateY(2px)}70%{transform:rotate(5deg) translateY(2px)}100%{transform:rotate(0)}}
  .bird.oops{animation:tilt .55s ease;}
  /* 吹き出し */
  .bubble{
    position:relative;background:#fff;border:2px solid var(--accent);
    color:var(--ink);font-weight:700;font-size:14px;border-radius:16px;
    padding:9px 15px;margin-bottom:8px;box-shadow:var(--shadow);
    max-width:270px;text-align:center;line-height:1.35;transition:.15s;
  }
  .bubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
    width:0;height:0;border:8px solid transparent;border-top-color:var(--accent);}
  .bubble::before{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    width:0;height:0;border:7px solid transparent;border-top-color:#fff;z-index:1;}
  .bubble.ok{border-color:var(--good);}
  .bubble.ok::after{border-top-color:var(--good);}
  .bubble.ng{border-color:var(--bad);}
  .bubble.ng::after{border-top-color:var(--bad);}
  @keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .bubble.pop{animation:pop .32s ease;}

  /* ---- tabs（4列×2段グリッド・ピル選択式） ---- */
  nav.modes{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
    margin:14px 0 6px;
  }
  nav.modes button{
    font-family:var(--round);font-size:.72rem;font-weight:600;
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:12px;padding:8px 3px 7px;cursor:pointer;line-height:1.15;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:56px;transition:transform .12s,background .14s,border-color .14s,color .14s,box-shadow .14s;
  }
  nav.modes button .ico{
    font-size:1.15rem;line-height:1;filter:grayscale(.2);opacity:.8;transition:.14s;
  }
  nav.modes button .lbl{font-size:.7rem;white-space:nowrap;letter-spacing:0;}
  nav.modes button:active{transform:translateY(1px);}
  nav.modes button[aria-selected="true"]{
    color:var(--accent-deep);background:var(--accent-soft);
    border-color:var(--accent);font-weight:700;
    box-shadow:0 2px 7px rgba(201,120,26,.15);
  }
  nav.modes button[aria-selected="true"] .ico{filter:none;opacity:1;transform:scale(1.1);}

  /* ---- card ---- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 16px;margin-top:10px;
  }
  .prompt{font-size:14px;color:var(--stave);margin:0 0 14px;min-height:1.4em;}
  .prompt b{color:var(--ink);}

  /* ---- score / hud ---- */
  .hud{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:14px 0 0;flex-wrap:wrap;
  }
  .stat{display:flex;gap:14px;font-size:13px;color:var(--muted);}
  .stat b{font-family:var(--sans);color:var(--accent);font-size:17px;font-weight:700;}
  .streak{color:var(--gold);}

  /* ---- staff area ---- */
  .stage{
    background:#fafaf7;
    border:1px solid var(--line);border-radius:10px;
    padding:14px 8px;display:flex;justify-content:center;overflow-x:auto;
  }
  .stage svg{display:block;}
  /* 再生中に鳴っている音符のハイライト */
  .snote.hl ellipse,.snote.hl line,.snote.hl path,.snote.hl rect,.snote.hl circle{fill:var(--accent)!important;stroke:var(--accent)!important;}

  /* ---- choices ---- */
  .choices{display:grid;gap:8px;margin-top:16px;}
  .choices.cols2{grid-template-columns:1fr 1fr;}
  .choices.cols3{grid-template-columns:1fr 1fr 1fr;}
  .opt{
    font-family:var(--sans);font-size:14px;font-weight:600;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:11px;padding:12px 10px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:8px;min-height:48px;
    transition:.12s;text-align:center;
  }
  .opt .num{
    font-family:var(--sans);font-weight:700;color:var(--accent-deep);
    border:1px solid var(--accent);background:var(--accent-soft);
    border-radius:6px;min-width:22px;height:22px;display:inline-flex;
    align-items:center;justify-content:center;font-size:13px;flex:none;
  }
  .opt:active{transform:translateY(1px);}
  .opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);}
  .opt.correct .num{background:var(--good);border-color:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
  .opt.wrong .num{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt.dim{opacity:.4;}
  .opt svg{flex:none;}

  /* duration bar */
  .durbar{height:14px;border-radius:4px;background:var(--bar-fill);opacity:.85;}

  /* ---- palette (listen mode) ---- */
  .palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
  .palette .opt{min-height:44px;padding:8px 10px;}
  .tray{
    min-height:70px;border:1.5px dashed var(--line);border-radius:12px;margin-top:12px;
    display:flex;align-items:center;gap:4px;padding:8px 10px;flex-wrap:wrap;
    background:#fafaf7;
  }
  .tray .chip{
    display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:4px;cursor:pointer;
  }
  .tray .chip:active{background:var(--bad-soft);}
  .tray .empty{color:var(--muted);font-size:13px;margin:auto;}
  .tray .traystaff{flex:1 1 100%;text-align:center;cursor:pointer;}
  .tray .traystaff svg{max-width:100%;height:auto;vertical-align:middle;}
  .tray .traytip{flex:1 1 100%;text-align:center;color:var(--muted);font-size:11px;margin-top:2px;}
  .fillmeter{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px;}
  .fillmeter>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}

  /* ---- buttons ---- */
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .btn{
    font-family:var(--sans);font-size:14px;font-weight:700;border-radius:10px;
    padding:12px 16px;cursor:pointer;border:1px solid var(--accent);
    background:var(--accent);color:#1a1a1a;transition:.12s;letter-spacing:.04em;
  }
  .btn.ghost{background:var(--card);color:var(--stave);border-color:var(--line);font-weight:600;}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#1a1a1a;}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn.wide{flex:1;}

  /* feedback banner */
  .fb{
    margin-top:14px;border-radius:11px;padding:11px 14px;font-size:14px;
    display:none;align-items:center;gap:8px;font-weight:600;
  }
  .fb.show{display:flex;}
  .fb.ok{background:var(--good-soft);color:var(--good);}
  .fb.ng{background:var(--bad-soft);color:var(--bad);}
  .fb .exp{font-weight:500;color:var(--stave);font-size:13px;}

  /* difficulty seg */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);}
  .seg button{
    border:0;background:transparent;font-family:var(--sans);font-size:12px;font-weight:600;
    color:var(--muted);padding:8px 13px;cursor:pointer;transition:.12s;
  }
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:700;}

  .toollabel{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;}
  .hidden{display:none!important;}

  /* ---- 祝福オーバーレイ（正解演出） ---- */
  #stageCard{position:relative;}
  .celebrate{
    position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border-radius:16px;
  }
  .celebrate .flash{
    position:absolute;inset:0;border-radius:16px;opacity:0;
    animation:celFlash .9s ease-out forwards;
  }
  .celebrate.ok .flash{background:radial-gradient(circle at center,var(--good-soft),transparent 70%);}
  .celebrate.ng .flash{background:radial-gradient(circle at center,var(--bad-soft),transparent 72%);}
  @keyframes celFlash{0%{opacity:0;}18%{opacity:.9;}100%{opacity:0;}}
  /* 中央の合図（イラスト or 記号） */
  .celebrate .hero{
    position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;
    transform:scale(.4);opacity:0;animation:celPop .55s cubic-bezier(.2,1.5,.4,1) forwards;
  }
  @keyframes celPop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .celebrate .hero.fade{animation:celFade .5s ease-in forwards;}
  @keyframes celFade{to{opacity:0;transform:scale(.9) translateY(-6px);}}
  /* 正解イラストのプレースホルダー（後日ここに画像を差し込む） */
  .celebrate .heroArt{
    width:120px;height:120px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--good-soft),#fff);border:2px dashed var(--good);
    font-size:52px;line-height:1;box-shadow:0 8px 24px rgba(47,125,91,.22);overflow:hidden;
  }
  .celebrate .heroArt img{width:100%;height:100%;object-fit:contain;display:block;}
  .celebrate .heroTxt{
    font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.06em;
    padding:4px 16px;border-radius:20px;
  }
  .celebrate.ok .heroTxt{color:#fff;background:var(--good);}
  .celebrate .heroX{
    font-size:74px;line-height:1;color:var(--bad);font-weight:700;font-family:var(--serif);
    text-shadow:0 4px 14px rgba(178,58,72,.28);
  }
  /* 紙吹雪 */
  .confetti{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.95;
    animation:confFall linear forwards;}
  @keyframes confFall{
    0%{transform:translateY(0) rotateZ(0);opacity:1;}
    100%{transform:translateY(var(--fall)) rotateZ(var(--spin));opacity:.2;}
  }

  /* ---- カウントイン（③リズム耳コピ 予告） ---- */
  .countin{
    position:absolute;inset:0;z-index:28;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;border-radius:16px;
    background:rgba(27,36,50,.06);
  }
  .countin .cnum{
    font-family:var(--serif);font-weight:700;color:var(--accent);
    font-size:96px;line-height:1;text-shadow:0 6px 22px rgba(192,71,43,.22);
  }
  .countin .cnum.beat{ animation:cntPop .48s cubic-bezier(.2,1.4,.4,1); }
  @keyframes cntPop{0%{transform:scale(.5);opacity:0;}45%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);opacity:.85;}}
  .countin .cgo{
    font-family:var(--serif);font-weight:700;color:var(--good);font-size:56px;letter-spacing:.06em;
    animation:cntPop .4s cubic-bezier(.2,1.4,.4,1);
  }

  /* ---- 音価てんびん（④） ---- */
  .balance{
    display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 2px;
    font-size:60px;line-height:1;user-select:none;
  }
  .balance .scale{
    transition:transform .7s cubic-bezier(.34,1.3,.5,1);transform:rotate(0deg);
    transform-origin:50% 60%;
  }
  .balance.tilt-left .scale{transform:rotate(-13deg);}
  .balance.tilt-right .scale{transform:rotate(13deg);}
  .balance .cap{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
  /* 回答後の左右バー比較 */
  .barcompare{
    margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    background:#fafaf7;
  }
  .barcompare .brow{display:flex;align-items:center;gap:10px;margin:7px 0;}
  .barcompare .blabel{
    font-family:var(--serif);font-weight:700;font-size:14px;color:var(--stave);
    width:26px;flex:none;text-align:center;
  }
  .barcompare .btrack{flex:1;display:flex;align-items:center;gap:0;}
  .barcompare .bfill{
    height:20px;border-radius:5px;transition:width .6s cubic-bezier(.34,1.2,.5,1);
    display:flex;align-items:center;
  }
  .barcompare .bwin{background:var(--good);}
  .barcompare .blose{background:var(--bar-fill);opacity:.8;}
  .barcompare .beq{background:var(--gold);}
  .barcompare .bval{
    font-size:12px;color:var(--stave);font-weight:600;margin-left:8px;white-space:nowrap;
  }
  .barcompare .bnote{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;}

  /* ---- reference (⑧ 解説) ---- */
  .ref{font-size:14px;color:var(--ink);}
  .ref h2{
    font-family:var(--serif);font-size:17px;font-weight:700;color:var(--stave);
    margin:0 0 4px;display:flex;align-items:center;gap:8px;letter-spacing:.02em;
  }
  .ref h2 .rn{
    font-family:var(--sans);font-weight:700;font-size:13px;color:#1a1a1a;background:var(--accent);
    width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;
    justify-content:center;flex:none;
  }
  .ref section{
    border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px;
    background:#ffffff;
  }
  .ref p{margin:8px 0;line-height:1.65;}
  .ref .lead{color:var(--stave);margin:2px 0 12px;}
  .ref b{color:var(--ink);}
  .ref .accent{color:var(--accent-deep);font-weight:700;}
  /* 音符一覧テーブル */
  .reftable{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .reftable th,.reftable td{
    border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle;
  }
  .reftable th{color:var(--muted);font-weight:600;font-size:12px;}
  .reftable td.nm{text-align:left;font-weight:600;color:var(--ink);white-space:nowrap;}
  .reftable td.beat{font-family:var(--sans);color:var(--accent-deep);font-weight:700;}
  .reftable .gl{display:flex;justify-content:center;align-items:center;min-height:44px;}
  .reftable tr.rest-row td.nm{color:var(--stave);}
  /* インライン譜例 */
  .refstaff{
    background:#fafaf7;border:1px solid var(--line);
    border-radius:10px;padding:10px 6px;display:flex;justify-content:center;
    overflow-x:auto;margin:10px 0;
  }
  .refstaff svg{display:block;}
  /* 計算・等価の囲み */
  .refbox{
    background:var(--accent-soft);border-radius:9px;padding:9px 12px;margin:8px 0;
    font-size:13px;color:var(--stave);
  }
  .refbox .eq{font-family:var(--serif);color:var(--ink);font-weight:700;}
  .refnote{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}
  /* ポップ装飾 */
  .refpop{
    background:var(--good-soft);border-radius:9px;padding:10px 13px;margin:10px 0;
    font-size:13.5px;color:var(--stave);line-height:1.7;border-left:4px solid var(--good);
  }
  .refpop b{color:var(--good);}
  .refwhy{
    display:inline-block;background:var(--gold);color:#fff;font-size:11px;font-weight:700;
    border-radius:6px;padding:2px 8px;margin-right:6px;letter-spacing:.04em;
  }
  .fracbox{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;
  }
  .fracchip{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;text-align:center;min-width:88px;
  }
  .fracchip .frac{font-family:var(--sans);font-size:18px;font-weight:700;color:var(--accent-deep);line-height:1.1;}
  .fracchip .lbl{font-size:11px;color:var(--muted);margin-top:3px;}
  .refgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){ .refgrid2{grid-template-columns:1fr;} }

  .toollabel2{display:none;}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;letter-spacing:.03em;}

  /* HUD右の進捗表示 */
  /* ---- クリア演出モーダル（ことりノーム風） ---- */
  .fc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
    align-items:center;justify-content:center;backdrop-filter:blur(3px);}
  .fc-overlay.on{display:flex;}
  .fc-overlay canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:201;}
  .fc-modal{position:relative;z-index:202;background:var(--card);border-radius:22px;
    padding:28px 22px 20px;width:min(320px,86vw);text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fcPop .4s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes fcPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .fc-stars{font-size:2rem;letter-spacing:.15em;margin-bottom:8px;animation:fcFloat 2s ease-in-out infinite;}
  @keyframes fcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .fc-icon{font-size:3.2rem;line-height:1;margin-bottom:4px;}
  .fc-title{font-size:1.6rem;font-weight:700;margin-bottom:2px;letter-spacing:.04em;color:var(--accent-deep);}
  .fc-sub{font-size:.9rem;color:var(--stave);margin-bottom:6px;font-weight:600;}
  .fc-score{font-size:.85rem;color:var(--muted);margin-bottom:18px;}
  .fc-btns{display:flex;gap:8px;}
  .fc-btns .btn{flex:1;}
  /* ===================================================================
     こども向けリニューアル（後追い上書き：丸く・大きく・やさしく）
     =================================================================== */
  h1{letter-spacing:.14em;font-size:1.4rem;}
  .wrap{max-width:440px;}
  /* タブ：4列×2段グリッド・ピル式（絵文字＋ラベル縦積み） */
  nav.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-bottom:none;margin:14px 0 6px;padding-bottom:0;}
  nav.modes button{
    flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:8px 3px 7px;color:var(--muted);margin-bottom:0;font-size:.72rem;
    min-height:56px;line-height:1.15;
  }
  nav.modes button .ico{font-size:1.18rem;line-height:1;filter:grayscale(.2);opacity:.82;transition:.14s;}
  nav.modes button .lbl{font-size:.7rem;white-space:nowrap;letter-spacing:0;}
  nav.modes button[aria-selected="true"]{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);
    font-weight:700;box-shadow:0 2px 7px rgba(201,120,26,.15);
  }
  nav.modes button[aria-selected="true"] .ico{filter:none;opacity:1;transform:scale(1.1);}
  /* --- 上位区分タブ（本番／練習／解説）--- */
  /* 区分は数がいくつでも1行・等幅。折り返すと☰が縦に間延びするため列を自動で割る。 */
  nav.sections{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:14px 0 8px;}
  nav.sections button.sec{
    font-family:var(--round);font-weight:700;font-size:clamp(.72rem,3vw,.92rem);
    border:1.5px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:14px;padding:12px 4px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:transform .12s,background .14s,border-color .14s,color .14s,box-shadow .14s;
  }
  nav.sections button.sec:active{transform:translateY(1px);}
  nav.sections button.sec[aria-selected="true"]{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);
    box-shadow:0 2px 8px rgba(201,120,26,.16);
  }
  /* 本番区分：到達点として格上げ（🔥＋選択時は塗りつぶし）*/
  nav.sections button.sec-main .sec-label::before{content:'🔥 ';font-size:.9em;}
  nav.sections button.sec-main{border-color:var(--accent);color:var(--accent-deep);}
  nav.sections button.sec-main[aria-selected="true"]{
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#fff;border-color:var(--accent-deep);
    box-shadow:0 3px 11px rgba(201,120,26,.32);
  }
  /* 練習区分以外では下位グリッドを隠す */
  nav.modes.hidden{display:none;}
  /* --- タブ開閉（☰）：選択後は選択中タブのみ残してスッキリ --- */
  .tabbar{display:flex;align-items:stretch;gap:6px;margin:14px 0 8px;}
  .tabbar nav.sections{flex:1;margin:0;}
  .tabtoggle{
    flex:0 0 auto;width:42px;border:1.5px solid var(--line);background:var(--card);
    border-radius:14px;color:var(--accent-deep);font-size:1.15rem;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .14s,border-color .14s;
  }
  .tabtoggle:active{transform:translateY(1px);}
  .tabwrap:not(.collapsed) .tabtoggle{background:var(--accent-soft);border-color:var(--accent);}
  /* 折りたたみ時：選択中のみ表示（上位・下位とも） */
  .tabwrap.collapsed nav.sections{display:flex;}
  .tabwrap.collapsed nav.sections button.sec[aria-selected="false"]{display:none;}
  .tabwrap.collapsed nav.sections button.sec[aria-selected="true"]{flex:1;}
  .tabwrap.collapsed nav.modes:not(.hidden){display:flex;margin-top:8px;}
  .tabwrap.collapsed nav.modes button[aria-selected="false"]{display:none;}
  .tabwrap.collapsed nav.modes button[aria-selected="true"]{flex:1;}
  /* ごく狭い端末では1行に4つ入らないので、2×2に組み替える。
     このとき☰が2行ぶんに伸びないよう、高さを固定して上に揃える。 */
  @media(max-width:349px){
    nav.sections{grid-auto-flow:row;grid-template-columns:repeat(2,1fr);}
    .tabbar{align-items:flex-start;}
    .tabtoggle{height:46px;}
  }
  /* 問題進行中：現在地ピルも隠し、☰だけ中央に（画像を主役に見せる） */
  .tabwrap.collapsed.quiz-active .tabbar{justify-content:center;}
  .tabwrap.collapsed.quiz-active nav.sections{display:none;}
  .tabwrap.collapsed.quiz-active nav.modes{display:none;}
  /* --- 本日クリア済みバッジ（絵文字／区分名の肩に金の✓）--- */
  nav.modes button .ico{position:relative;}
  nav.sections button.sec{position:relative;}
  nav.modes button .ico .clr, nav.sections button.sec .clr{
    position:absolute;top:-5px;right:-9px;
    width:15px;height:15px;border-radius:50%;
    background:linear-gradient(135deg,#f2b90c,#d98a00);color:#fff;
    font-size:.6rem;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--card);box-shadow:0 1px 3px rgba(160,110,0,.45);
  }
  nav.sections button.sec .sec-clr{top:8px;right:10px;}
  nav.sections button.sec-main[aria-selected="true"] .sec-clr{border-color:var(--accent-deep);}
  /* カード：ふっくら */
  .card{border-radius:var(--radius);border:2px solid var(--line);padding:18px 15px 20px;}
  /* 累積スタッツは隠し、セッション進捗を主役に */
  .hud .stat{display:none;}
  .hud{margin-top:2px;justify-content:flex-end;}
  /* 選択肢：大きく丸く、押すとぷにっと */
  .choices{gap:10px;margin-top:18px;}
  .opt{border:2px solid var(--line);border-radius:16px;min-height:58px;font-size:15px;padding:14px 10px;box-shadow:0 2px 5px rgba(120,80,20,.06);transition:transform .1s,box-shadow .14s,background .14s,border-color .14s,color .14s;}
  .opt .num{border-radius:9px;min-width:24px;height:24px;background:var(--paper2);border-color:var(--accent);}
  .opt:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 2px rgba(120,80,20,.04);}
  .opt.correct{box-shadow:0 0 0 3px var(--good-soft);animation:optpop .34s ease;}
  @keyframes optpop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
  /* ボタン：まるっと大きく */
  .btn{border-radius:16px;padding:14px 18px;font-size:15px;border-width:2px;color:#fff;}
  .btn,.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.ghost{background:var(--card);color:var(--accent-deep);border-color:var(--accent);}
  .seg{border-radius:12px;border-width:2px;}
  .seg button{padding:7px 12px;font-weight:700;}
  /* ==== セッション進捗バー（旧レベルパネル枠を流用） ==== */
  .sessbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--paper2);border:2px solid var(--line2);border-radius:14px;
    padding:8px 12px;margin:4px 0 12px;flex-wrap:wrap;
  }
  .sessbar .qn{font-size:13px;color:var(--stave);font-weight:700;}
  .sessbar .qn b{color:var(--accent-deep);font-size:16px;}
  .sess-dots{display:flex;gap:6px;align-items:center;}
  .sess-dots .d{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card);transition:.2s;font-size:11px;line-height:12px;text-align:center;color:#fff;}
  .sess-dots .d.ok{background:var(--good);border-color:var(--good);}
  .sess-dots .d.ng{background:var(--bad);border-color:var(--bad);}
  .sess-dots .d.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sess-diff{font-size:12px;color:var(--muted);font-weight:700;}
  .sess-diff b{color:var(--accent-deep);}
  /* 結果オーバーレイの星を大きく */
  .fc-stars{color:var(--star);}
  /* ==== 難易度変化の告知 ==== */
  .card{position:relative;}
  .difftoast{
    position:absolute;left:50%;top:8px;transform:translate(-50%,-16px);
    display:flex;align-items:center;gap:8px;white-space:nowrap;
    background:var(--accent);color:#fff;font-weight:800;font-size:14px;
    padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(120,80,20,.22);
    opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,1.4,.4,1),opacity .28s;z-index:30;
  }
  .difftoast.down{background:var(--sky);color:#22506b;}
  .difftoast b{font-weight:800;}
  .difftoast .dt-ico{font-size:18px;line-height:1;}
  .difftoast.show{opacity:1;transform:translate(-50%,0);}
  @keyframes labflash{0%,100%{background:transparent}30%{background:var(--accent-soft)}}
  .sess-diff.flash{animation:labflash .7s ease 2;border-radius:8px;padding:2px 6px;}
  .sess-diff.flash b{color:var(--accent-deep);}
  /* ==== デイリー達成画面（また明日） ==== */
  .dailydone{text-align:center;padding:22px 10px 10px;}
  .dailydone .dd-emoji{font-size:52px;line-height:1;}
  .dailydone .dd-title{font-size:19px;font-weight:800;color:var(--accent-deep);margin-top:8px;}
  .dailydone .dd-stars{font-size:30px;color:var(--star);letter-spacing:4px;margin:8px 0;}
  .dailydone .dd-score{font-size:15px;color:var(--ink);}
  .dailydone .dd-score b{color:var(--accent-deep);}
  .dailydone .dd-streak{font-size:22px;font-weight:800;color:var(--accent-deep);margin:12px 0 4px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:14px;padding:8px 14px;display:inline-block;}
  .dailydone .dd-sub{font-size:13px;color:var(--muted);margin-top:10px;}

  /* ============================================================
     画面の状態：body に home / quiz / honban を付けて切り替える
     - home  ：起動直後の「今日の練習」
     - quiz  ：出題中。譜面に視線を集めるため周辺を静かにする
     - honban：本番（腕だめし）。コンボと残り問題を強調する
  ============================================================ */
  /* --- 出題中は周辺を控えめにして、譜面と回答を主役にする --- */
  body.quiz header{padding:10px 0 0;}
  body.quiz h1{font-size:1.05rem;letter-spacing:.14em;}
  body.quiz .sub{display:none;}
  body.quiz .birdstage{margin:6px auto 0;}
  body.quiz #birdGreen.sensei{width:min(210px,54vw);height:104px;border-width:2px;border-radius:14px;}
  body.quiz .bubble{font-size:12.5px;padding:6px 12px;}
  body.quiz #stageCard .hud{display:none;}          /* 累積statは進捗バーに任せる */
  body.quiz .prompt{font-size:15px;margin-bottom:12px;}
  body.quiz .stage{padding:20px 8px;}
  body.quiz .stage svg{width:100%;height:auto;max-width:min(560px,92vw);}
  body.quiz .sessbar{margin-bottom:14px;}
  body.quiz .sessbar .qn b{font-size:19px;}
  body.quiz .sess-dots .d{width:18px;height:18px;}

  /* --- 本番（腕だめし）--- */
  body.honban.quiz #stageCard{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 6px 20px rgba(0,0,0,.08);}
  body.honban.quiz .sessbar{background:var(--accent-soft);border-color:var(--accent);}
  .honban-tag{
    font-size:11px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);
    border-radius:6px;padding:2px 8px;margin-right:6px;
  }
  .combo{font-size:12px;font-weight:800;color:var(--muted);}
  .combo.on{color:var(--accent-deep);}
  .combo .cn{font-size:17px;}
  .combo.pop{animation:pop .32s ease;}
  .remain{font-size:12px;font-weight:700;color:var(--stave);}
  .remain b{color:var(--accent-deep);font-size:15px;}

  /* --- ホーム画面 --- */
  .home{padding:2px 0 6px;}
  .home .hgreet{font-size:14px;color:var(--stave);font-weight:700;text-align:center;margin:0 0 4px;}
  .home .hstreak{
    text-align:center;font-size:13px;color:var(--muted);margin:0 0 14px;
  }
  .home .hstreak b{color:var(--accent-deep);font-size:20px;font-weight:800;}
  .home h3{
    font-family:var(--serif);font-size:14px;color:var(--stave);font-weight:700;
    margin:16px 0 8px;display:flex;align-items:center;gap:6px;
  }
  .home .rec{
    border:2px solid var(--accent);background:var(--accent-soft);border-radius:16px;
    padding:14px;text-align:center;
  }
  .home .rec .rlabel{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent-deep);}
  .home .rec .rname{font-size:19px;font-weight:800;color:var(--ink);margin:6px 0 2px;}
  .home .rec .rwhy{font-size:12px;color:var(--stave);margin-bottom:12px;}
  .home .dlist{display:flex;flex-direction:column;gap:8px;}
  .home .drow{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:2px solid var(--line);background:var(--card);border-radius:14px;
    padding:11px 13px;cursor:pointer;font:inherit;transition:.12s;
  }
  .home .drow:active{transform:translateY(1px);}
  .home .drow .dico{font-size:22px;flex:none;width:28px;text-align:center;}
  .home .drow .dname{flex:1;font-size:14px;font-weight:700;color:var(--ink);}
  .home .drow .dstat{font-size:11px;font-weight:800;letter-spacing:.06em;flex:none;}
  .home .drow.done{border-color:var(--good);background:var(--good-soft);}
  .home .drow.done .dstat{color:var(--good);}
  .home .drow.mid{border-color:var(--accent);}
  .home .drow.mid .dstat{color:var(--accent-deep);}
  .home .drow.todo .dstat{color:var(--muted);}
  .home .drow .dstars{font-size:12px;color:var(--star);letter-spacing:1px;}
  .home .hall{
    text-align:center;border:2px solid var(--gold);background:#fffdf3;border-radius:16px;
    padding:14px;font-size:14px;font-weight:700;color:var(--accent-deep);
  }

  /* --- 回答後の流れ（結果 → 理由 → つぎへ）--- */
  .fb .verdict{font-size:17px;font-weight:800;}
  .fb .reason{display:block;font-size:13px;margin-top:4px;opacity:.92;}
  .row.afteranswer{animation:fadeUp .3s ease both;animation-delay:.18s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* --- 音価てんびん：比較のアニメーション --- */
  .balance .scale.swing{animation:balSwing .5s ease;}
  @keyframes balSwing{0%{transform:rotate(0);}30%{transform:rotate(-6deg);}60%{transform:rotate(5deg);}100%{transform:rotate(0);}}
  .barcompare .bdiff{
    text-align:center;font-size:13px;font-weight:800;color:var(--accent-deep);
    margin-top:10px;opacity:0;transition:opacity .3s ease;
  }
  .barcompare .bdiff.on{opacity:1;}
  .barcompare .btrack{position:relative;}
  .barcompare .bmark{
    position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--stave);
    opacity:0;transition:opacity .3s ease .55s;
  }
  .barcompare .bmark.on{opacity:.55;}

  /* ============================================================
     ボタンの役割は3段階。見た目で優先度が分かるようにする。
       .btn        … 主ボタン（塗り）。1つの画面に1つだけ
       .btn.ghost  … 補助（白地＋アクセント枠）。何度でも押せる操作
       .btn.sub    … 控えめ（白地＋グレー枠）。取り消し系
     並び順は「補助 → 主」。主ボタンは常に最下段・全幅に置く。
  ============================================================ */
  .btn.sub{background:var(--card);color:var(--muted);border-color:var(--line);font-weight:600;}
  .btn.sub:disabled{opacity:.4;}
  #controls{gap:8px;}
  #controls.stack{flex-direction:column;align-items:stretch;}
  #controls.stack>.btn{width:100%;}
  #controls .subrow{display:grid;grid-template-columns:2fr 1fr;gap:8px;width:100%;}
  #controls .subrow .btn{width:100%;}
  #controls.split{display:grid;grid-template-columns:1fr 1fr;}
  #controls.split .btn{width:100%;}
  /* 残り拍数の案内（④耳コピ） */
  .remainbeats{
    text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:6px;
  }
  .remainbeats.full{color:var(--good);}
  /* 操作行の外に置く主ボタン（ホーム・デイリー完了画面）も全幅に揃える */
  .home .rec .btn, .dailydone .btn{width:100%;display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>リズトレ</h1>
    <p class="sub">おんぷの ながさを、目と耳で。</p>
    <div class="birdstage" id="birdstage">
      <div class="bubble" id="birdBubble"><span id="bubbleTxt">いっしょに 練習しよう！</span></div>
      <div class="birds">
        <!-- ▼ マスコット：ヨルハ先生（画像はこのHTML内に埋め込み済み）▼
             ★yoruha-sensei.jpeg をHTMLに直接埋め込んでいます。画像ファイルを
               同じフォルダに置く必要はありません。

<script>
"use strict";
/* ============================================================
   リズトレ  Note-Value Trainer
   8タブ：①穴うめ ②ながさ当て ③なまえ当て ④耳コピ ⑤音価てんびん ⑥小節けいさつ ⑦腕だめし ⑧解説
   単一HTML・オフライン・iOS WKWebView 配慮
============================================================ */

/* ---------- 1拍=48tick 統一 ---------- */
const T = 48; // ticks per beat
const DUR = {
  whole:     {tick:192, name:'全音符',      short:'全',   dots:0, base:'whole'},
  dotHalf:   {tick:144, name:'付点二分音符', short:'付2分', dots:1, base:'half'},
  half:      {tick:96,  name:'二分音符',    short:'2分',  dots:0, base:'half'},
  dotQuarter:{tick:72,  name:'付点四分音符', short:'付4分', dots:1, base:'quarter'},
  quarter:   {tick:48,  name:'四分音符',    short:'4分',  dots:0, base:'quarter'},
  dotEighth: {tick:36,  name:'付点八分音符', short:'付8分', dots:1, base:'eighth'},
  eighth:    {tick:24,  name:'八分音符',    short:'8分',  dots:0, base:'eighth'},
  sixteenth: {tick:12,  name:'十六分音符',  short:'16分', dots:0, base:'sixteenth'},
};
const beats = t => t/T;
const beatStr = t => {
  const b = t/T;
  if(Number.isInteger(b)) return b+'拍';
  return (b).toString()+'拍';
};

/* ============================================================
   拍子（メーター）ヘルパー
   sig は [分子, 分母]。分母4＝単純拍子（四分音符＝1拍）、
   分母8で分子が3の倍数＝複合拍子（付点四分音符＝1拍、八分3つでひとまとまり）。
   ENABLE_68 を false にすると、6/8 が解説からも練習からも一括で外れる。
============================================================ */
const ENABLE_68 = true;
const SIG_SIMPLE = [[2,4],[3,4],[4,4]];
const SIG_ALL = () => ENABLE_68 ? SIG_SIMPLE.concat([[6,8]]) : SIG_SIMPLE.slice();
const isCompound = sig => !!sig && sig[1]===8 && sig[0]%3===0;
// 1小節ぶんのtick（全音符＝192tick）
const barTickOf = sig => sig[0]*(192/sig[1]);
// 拍（脈）1つぶんのtick。複合拍子は付点四分＝72tick
const pulseTickOf = sig => isCompound(sig) ? (192/sig[1])*3 : (192/sig[1]);
// 拍の数。6/8 は「2拍を3つ割り」なので2
const pulseCountOf = sig => isCompound(sig) ? sig[0]/3 : sig[0];
// 1小節の長さの説明ラベル
function barLenLabel(sig){
  if(isCompound(sig)) return `八分音符${sig[0]}つ（＝${pulseCountOf(sig)}拍を3つずつ）`;
  return `${sig[0]}拍`;
}
// 連桁をまとめる単位(tick)。実際の記譜習慣に合わせる
function beamUnitOf(sig, hasSixteenth){
  if(isCompound(sig)) return pulseTickOf(sig);   // 複合拍子：八分3つ（付点四分）ごと
  if(hasSixteenth) return T;                     // 十六分をふくむときは1拍ごと
  if(sig && sig[0]===3) return T;                // 3拍子は1拍ごと
  return 2*T;                                    // 4拍子・2拍子は2拍ごと
}
// タイ分割（拍でまとめた形）は四分＝1拍の単純拍子でのみ有効
const canTie = sig => !isCompound(sig);

/* ---------- 音符SVG描画 ---------- */
// 1音符を単体で描く（凡例・選択肢用）
function noteGlyph(key, opt={}){
  const d = DUR[key]; if(!d) return '';
  const w = opt.w||34, h = opt.h||46, col = opt.color||'var(--ink)';
  const rest = opt.rest;
  const cx = 13, baseY = 30; // 符頭中心
  let g='';
  if(rest){
    // 単体表示時はグリフ枠の中央に光学センタリング
    g = restPath(d.base, w/2, h/2-(REST_VCENTER[d.base]||16), col, d.dots, true);
  }else{
    // 符頭
    const filled = (d.base==='eighth'||d.base==='sixteenth'||d.base==='quarter');
    g += `<g transform="translate(${cx},${baseY}) rotate(-20)">
      <ellipse cx="0" cy="0" rx="6" ry="4.5" fill="${filled?col:'none'}"${filled?'':` stroke="${col}" stroke-width="1.8"`}/></g>`;
    // 符幹（二分・四分・八分・十六）: 全音符は無し
    if(d.base!=='whole'){
      g += `<line x1="${cx+5.4}" y1="${baseY-1}" x2="${cx+5.4}" y2="6" stroke="${col}" stroke-width="1.7"/>`;
    }
    // 符鉤
    if(d.base==='eighth'){
      g += flag(cx+5.4,6,col,0);
    }else if(d.base==='sixteenth'){
      g += flag(cx+5.4,6,col,0)+flag(cx+5.4,6,col,7);
    }
    // 付点
    if(d.dots){ g += `<circle cx="${cx+13}" cy="${baseY+1}" r="1.9" fill="${col}"/>`; }
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function flag(x,y,col,dy){
  // ことりノーム drawFlags と同一のベジェ形状
  return `<path d="M ${x} ${y+dy} C ${x+10} ${y+dy+3} ${x+11} ${y+dy+10} ${x+6} ${y+dy+16}
    C ${x+11} ${y+dy+9} ${x+9} ${y+dy+4} ${x} ${y+dy+5} Z" fill="${col}"/>`;
}
function restPath(base,x,y,col,dots,standalone){
  // 座標規約: y+16 が五線の第3線（中央線）。lineGap=8 → 五線は y+0 / y+8 / y+16 / y+24 / y+32
  // 休符の形はことりノーム drawRestSVG と同一。bY をことりノームの baseY 相当（=y+33）に置いて移植し、
  // 五線の座標系（y+16=中央線）に合わせて上下位置を調整する。
  let p='';
  const bY = y+33;
  if(base==='whole'){        // 全休符：第4線（上から2本目）から「ぶら下がる」
    p=`<rect x="${x-5.5}" y="${y+8}" width="11" height="4.2" fill="${col}"/>`;
    // 単体表示（五線なし）では、接する第4線を短く添えて二分休符と区別できるようにする
    if(standalone) p+=`<line x1="${x-9}" y1="${y+8}" x2="${x+9}" y2="${y+8}" stroke="${col}" stroke-width="1.3"/>`;
  }else if(base==='half'){   // 二分休符：第3線（中央線）の上に「乗る」
    p=`<rect x="${x-5.5}" y="${y+11.8}" width="11" height="4.2" fill="${col}"/>`;
    if(standalone) p+=`<line x1="${x-9}" y1="${y+16}" x2="${x+9}" y2="${y+16}" stroke="${col}" stroke-width="1.3"/>`;
  }else if(base==='quarter'){ // 四分休符（ことりノーム流の稲妻）
    const t=bY-34;

     +`<path d="M ${x-1} ${t+2} Q ${x+4} ${t+1} ${x+5} ${t-2}" fill="none" stroke="${col}" stroke-width="1.5"/>`

// 休符ごとの光学的中心（単体グリフの上下センタリング用）
const REST_VCENTER={whole:10, half:14, quarter:16, eighth:14, sixteenth:15};

// 五線譜に音符列を描く（穴埋め・警察・聴音の答え合わせ用）
/* ---------- 音価分割＋タイ（ことりノーム流） ----------
   拍・小節をまたぐ音価を「拍をまたがぬ単一音価」に分割し、2つ目以降にtieを付ける。
   ことりノームは16分=1unit・拍=4unitのunit系。リズトレは16分=12tick・拍=48tickなので u = tick/12 で換算する。 */
function scoreKey(base,dot){
  if(base==='whole') return 'whole';
  if(base==='half') return dot?'dotHalf':'half';
  if(base==='quarter') return dot?'dotQuarter':'quarter';
  if(base==='eighth') return dot?'dotEighth':'eighth';
  return 'sixteenth';
}
function scoreSplitTick(startTick,lenTick,totalTick){
  const BU=4, SINGLE=new Set([16,12,8,6,4,3,2,1]);
  const TBL=[{u:16,base:'whole',dot:false},{u:12,base:'half',dot:true},{u:8,base:'half',dot:false},{u:6,base:'quarter',dot:true},{u:4,base:'quarter',dot:false},{u:3,base:'eighth',dot:true},{u:2,base:'eighth',dot:false},{u:1,base:'sixteenth',dot:false}];
  const start=startTick/12, len=lenTick/12, notes=[];
  // 小節のまん中（偶数拍子のみ）を「音符でまたいではいけない」境界として保護する。
  // 4/4→8unit（3拍目）／2/4→4unit（2拍目）。3拍子など奇数拍はまん中が拍の途中に来るため保護しない。
  const totalU = totalTick ? Math.round(totalTick/12) : 0;
  const beats = totalU/BU;
  const mid = (totalU>0 && Number.isInteger(beats) && beats%2===0) ? totalU/2 : null;
  const emit=(s,l)=>{
    if(SINGLE.has(l)){
      const io=s%BU;
      // 小節先頭(0)から始まる音符（全音符・付点二分など）は許容。途中から始まってまん中をまたぐ音符のみ分割。
      const crossesMid = (mid!=null && s>0 && s<mid && s+l>mid);
      if((io+l<=BU || io===0) && !crossesMid){ notes.push(TBL.find(n=>n.u===l)); return; }
    }
    const io=s%BU, toEnd=io===0?BU:(BU-io), first=Math.min(l,toEnd);
    if(!SINGLE.has(first)){ let r=first; while(r>0){ const nt=TBL.find(n=>n.u<=r); notes.push(nt); r-=nt.u; } }
    else notes.push(TBL.find(n=>n.u===first));
    const rem=l-first; if(rem>0) emit(s+first,rem);
  };
  emit(start,len);
  return notes.map(n=>({key:scoreKey(n.base,n.dot), tick:n.u*12}));
}
function scoreSplitRestTick(startTick,lenTick,totalTick){
  const BU=4, baseU={whole:16,half:8,quarter:4,eighth:2,sixteenth:1};
  const start=startTick/12, len=lenTick/12, total=totalTick?Math.round(totalTick/12):0;
  if(total && start===0 && len===total) return [{key:'whole', tick:16*12}];
  const out=[], halfUnit=BU*2;
  const push=(name,dot)=>{ const u=baseU[name]*(dot?1.5:1); out.push({key:scoreKey(name,dot), tick:u*12}); };
  const fillBeat=(off,length)=>{
    if(off===0 && length===BU){ push('quarter',false); return; }
    let s=off, e=off+length;
    while(s<e){
      const eStart=Math.floor(s/2)*2;
      if(s===eStart && s+2<=e){ push('eighth',false); s+=2; }
      else { const segEnd=Math.min(eStart+2,e); for(let k=s;k<segEnd;k++) push('sixteenth',false); s=segEnd; }
    }
  };
  let s=start, end=start+len;
  while(s<end){
    if(total && s%halfUnit===0 && s+halfUnit<=end && s+halfUnit<=total){ push('half',false); s+=halfUnit; continue; }
    const beatStart=Math.floor(s/BU)*BU, segEnd=Math.min(beatStart+BU,end);
    fillBeat(s-beatStart, segEnd-s); s=segEnd;
  }
  return out;
}
// 音符列を「単一音価＋タイ」へ展開。空欄(blank)は分割しない（穴埋めの答えを守る）。
function expandTies(seq,totalTick){
  const out=[]; let acc=0;
  for(let idx=0; idx<seq.length; idx++){
    const n=seq[idx];
    const tick=n.tick||(DUR[n.key]||{tick:48}).tick;
    if(n.blank){ out.push({...n,tick,tie:false,_src:idx}); acc+=tick; continue; }
    if(n.rest){
      const pcs=scoreSplitRestTick(acc,tick,totalTick);
      if(pcs.length) pcs.forEach(p=>out.push({key:p.key,rest:true,mark:n.mark,tick:p.tick,tie:false,_src:idx}));
      else out.push({...n,tick,tie:false,_src:idx});
      acc+=tick; continue;
    }
    const pcs=scoreSplitTick(acc,tick,totalTick);
    if(pcs.length) pcs.forEach((p,i)=>out.push({key:p.key,mark:n.mark,tick:p.tick,tie:i>0,_src:idx}));
    else out.push({...n,tick,tie:false,_src:idx});
    acc+=tick;
  }
  return out;
}

function staffSVG(seq, opt={}){
  // seq: [{key, rest, blank, mark}]
  const pad=18, slotMin=42, top=14, staveH=48, height=86;
  const totalTick = opt.totalTick || seq.reduce((s,n)=>s+(n.tick||DUR[n.key].tick),0) || 192;
  // 幅は tick に比例（音価バー的発想）
  const meterSig = opt.meterSig || null;   // [分子,分母] 例[4,4]
  const SIG = meterSig ? 24 : 0;            // 拍子記号ぶんの左スペース
  // 拍・小節をまたぐ音価を単一音価＋タイに展開（ことりノーム流）。
  // 出題では分割せず元のまま。回答（答え合わせ）表示のときだけ opt.tie:true で有効化する。
  if(opt.tie===true) seq = expandTies(seq, totalTick);
  const ticksArr = seq.map(n=>n.tick||(DUR[n.key]||{tick:48}).tick);
  const sumTicks = ticksArr.reduce((a,b)=>a+b,0) || totalTick;
  // --- tick比例配置：1拍あたり一定幅で並べ、音符を時間位置（拍）に置く ---
  //   拍が均等に区切られ、再生バーが一定速度で進む。各音符幅は音価に比例。
  const beatW = 66;                                   // 1拍あたりの幅(px)
  const barBeats = Math.max(sumTicks, totalTick)/T;   // 表示する拍数（不足小節は末尾に空白）
  const usable = Math.max(barBeats*beatW, 320);
  const noteOff = 9;                                  // スロット頭からの音符位置（一定＝バー等速）
  const widths = ticksArr.map(tk => (tk/(barBeats*T))*usable);
  let x = pad + SIG;
  const y0 = top; // 五線最上
  const lineGap=8;
  // --- 終止線の位置 ---
  // opt.barTick 指定時（正解表示用）：超過小節では終止線を本来の拍位置に置き、
  // 超過分の音符が終止線をはみ出して見えるようにする
  let barX = usable + pad + SIG, overZone = '';
  if(opt.barTick && sumTicks > opt.barTick){
    let acc = 0, bx = pad + SIG;
    for(let i=0;i<seq.length;i++){
      if(acc + ticksArr[i] >= opt.barTick){
        bx += widths[i] * ((opt.barTick - acc) / ticksArr[i]);
        break;
      }
      acc += ticksArr[i]; bx += widths[i];
    }
    barX = bx;
    overZone = `<rect x="${barX}" y="${y0-8}" width="${usable+pad+SIG-barX+4}" height="${4*lineGap+16}" fill="var(--bad)" opacity="0.08"/>`+
      `<text x="${Math.min((barX+usable+pad+SIG)/2, usable+pad+SIG-6)}" y="${y0+4*lineGap+18}" text-anchor="middle" font-size="10" fill="var(--bad)">はみ出し</text>`;
  }
  let lines='';
  for(let i=0;i<5;i++){ const yy=y0+i*lineGap; lines+=`<line x1="0" x2="${usable+pad*2+SIG}" y1="${yy}" y2="${yy}" stroke="var(--stave)" stroke-width="1"/>`;}
  // 拍子記号（分子・分母を縦2段。譜頭の開始線の直後に置く）
  const sigSVG = meterSig ? (
    `<text x="${pad+SIG/2}" y="${y0+lineGap+3}" text-anchor="middle" font-family="var(--sans)" font-weight="700" font-size="16" fill="var(--stave)">${meterSig[0]}</text>`+
    `<text x="${pad+SIG/2}" y="${y0+3*lineGap+4}" text-anchor="middle" font-family="var(--sans)" font-weight="700" font-size="16" fill="var(--stave)">${meterSig[1]}</text>`
  ) : '';

  // 拍頭ガイド（薄い破線）：拍をまたぐ連桁でも拍の切れ目が一目で分かるように
  let beatGuides='';

      if(gx>pad+SIG+2 && gx<barX-2){
        beatGuides+=`<line x1="${gx.toFixed(1)}" x2="${gx.toFixed(1)}" y1="${y0}" y2="${y0+4*lineGap}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3" opacity="0.75"/>`;

        sigSVG+beatGuides+
        `<line x1="${barX}" x2="${barX}" y1="${y0}" y2="${y0+4*lineGap}" stroke="${overZone?'var(--bad)':'var(--stave)'}" stroke-width="1.4"/>`+lines;

    // パス1：連続する連桁可能音符（八分・十六分）をひとまとまりに（休符・空欄・四分以上で切る）

      const beamable = !n.rest && !n.blank && (d.base==='eighth'||d.base==='sixteenth');
      if(beamable) run.push(i); else { if(run.length) runs.push(run); run=[]; }
    }
    if(run.length) runs.push(run);

      const unit = beamUnitOf(meterSig, hasSixteenth);

      const flushSub=()=>{ if(sub.length>=2){ const g=sub.slice(); g.forEach(gi=>beamOf[gi]=g); } sub=[]; };

    const stemX = i => cxArr[i] + 5.4; // 符幹は回転させていないため x=5.4（符頭中心cx基準）ぴったりに合わせる
    seq.forEach((n,idx)=>{
      const g=beamOf[idx];
      if(!g || seen.has(g)) return; seen.add(g);
      const col = n.mark==='ok'?'var(--good)':n.mark==='ng'?'var(--bad)':'var(--ink)';

      // 2次ビーム（十六分のみ。連続区間ごとに短い横棒、単独なら内側へ跳ねる）

        if(next16){

          // 拍の後半にある十六分は左（拍頭側）、前半にある十六分は右（次の音側）。
          // 例）付点八分＋十六分→左向き／十六分＋付点八分→右向き。

    const px=cxArr[idx-1], cx=cxArr[idx];

  });
  return `<svg width="${usable+pad*2+SIG}" height="${height}" viewBox="0 0 ${usable+pad*2+SIG} ${height}" xmlns="http://www.w3.org/2000/svg">${lines}${notes}</svg>`;
}

// 音価バー（長さ比較の signature）
function durBar(tick, opt={}){
  const unit = opt.unit||42; // 1拍あたりpx
  const w = Math.max(10, (tick/T)*unit);
  const col = opt.color||'var(--bar-fill)';
  return `<div class="durbar" style="width:${w}px;background:${col}"></div>`;
}

/* ---------- Web Audio クリック ---------- */
let AC=null;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended'){ AC.resume(); }
  return AC;
}
// kind:'count' … カウントイン用の低くこもった音（メトロノームの木の音に近い）
// kind:'note'  … 問題のリズム用の高く明るい音
// 同じ音だと「どこからが問題か」が分からなくなるため、必ず音色を変える。
function click(time, accent, kind){
  const ac=audio(); if(!ac) return;
  const isCount = kind==='count';
  const len = isCount?0.05:0.03, sr=ac.sampleRate, buf=ac.createBuffer(1,Math.round(sr*len),sr);
  const data=buf.getChannelData(0);
  const decay = isCount?10:6;
  for(let i=0;i<data.length;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,decay); }
  const src=ac.createBufferSource(); src.buffer=buf;
  const flt=ac.createBiquadFilter(); flt.type='bandpass';
  flt.frequency.value = isCount ? (accent?1100:820) : (accent?2600:1800);
  flt.Q.value = isCount ? 1.8 : 0.9;
  const g=ac.createGain(); g.gain.value = isCount ? (accent?0.55:0.4) : (accent?0.95:0.6);
  src.connect(flt); flt.connect(g); g.connect(ac.destination);
  src.start(time);
}
// tickシーケンスをテンポで再生
let playTimer=null;
function playSequence(seq, bpm, opt={}){
  const ac=audio(); if(!ac){ opt.onEnd&&opt.onEnd(); return; }
  const spb=60/bpm;                 // 1拍秒
  const lead=0.12;
  const countBeats = opt.countIn||0;  // カウントイン拍数（0なら無し）
  const cUnit = opt.countUnitTick || T;   // カウント1つぶんのtick（6/8は付点四分＝72）
  const cspb = spb*(cUnit/T);
  const countSec = countBeats*cspb;
  const t0=ac.currentTime+lead+countSec;   // 本編の開始時刻（カウント後）
  // --- カウントイン：各拍でクリック音＋数字コールバック ---
  // 最後の1拍はわざと鳴らさない。拍は流れたまま「間」ができ、問題の頭がはっきり立つ。
  if(countBeats>0){
    const silentLast = countBeats>=3;
    for(let b=0;b<countBeats;b++){
      const ct=ac.currentTime+lead+b*cspb;
      if(!(silentLast && b===countBeats-1)) click(ct, b===0, 'count');  // 頭拍だけアクセント
      if(opt.onCount){
        const remain=countBeats-b;           // 「4・3・2・1」と減っていく数字
        const delayMs=(ct-ac.currentTime)*1000;
        setTimeout(()=>opt.onCount(remain, false), Math.max(0,delayMs));
      }
    }
    // カウント終了＝本編開始の合図（「スタート！」用）
    if(opt.onCount){
      const delayMs=(t0-ac.currentTime)*1000;
      setTimeout(()=>opt.onCount(0, true), Math.max(0,delayMs));
    }
  }
  let acc=0;
  const events=[];
  seq.forEach((n,i)=>{
    // n は文字列キー（'quarter'等）またはオブジェクト（{key,tick,rest}）の両方を許容
    const d = (typeof n==='string') ? DUR[n] : (DUR[n.key]||null);
    const tick = (typeof n==='object' && n.tick!=null) ? n.tick : (d?d.tick:T);
    const isRest = (typeof n==='object') && n.rest;
    const onsetT = t0+(acc/T)*spb;
    if(!isRest) events.push({t:onsetT, accent:i===0});
    // 各音符・休符の頭で、いま鳴っている位置を通知（ハイライト用）
    if(opt.onStep){ const delayMs=(onsetT-ac.currentTime)*1000; setTimeout(()=>opt.onStep(i), Math.max(0,delayMs)); }
    acc+=tick;
  });
  events.forEach(e=>click(e.t, e.accent&&opt.accentFirst, 'note'));
  const totalSec=(acc/T)*spb;
  clearTimeout(playTimer);
  playTimer=setTimeout(()=>{ opt.onEnd&&opt.onEnd(); }, (lead+countSec+totalSec+0.15)*1000);
}

// 譜面を鳴らしつつ、再生位置を示す縦バー（プレイヘッド）をなめらかに滑らせ、
// 通過する音符もハイライトする。container 内の .stage svg すべてにバーを乗せる（2段対応）。
function playStaffBar(seq, bpm, container, onDone){
  const SVGNS='http://www.w3.org/2000/svg';
  const spb=60/bpm, lead=0.12;
  const totalTick=seq.reduce((s,n)=>s+(n.tick||(DUR[n.key]||{tick:48}).tick),0);
  const total=(totalTick/T)*spb;
  const clearHL=()=>container.querySelectorAll('.snote.hl').forEach(e=>e.classList.remove('hl'));
  // 各段：再生時刻→x座標 の区分線形の点列と、バー線を用意
  const bars=Array.from(container.querySelectorAll('.stage svg')).map(svg=>{
    const vb=(svg.getAttribute('viewBox')||'0 0 300 86').split(' ').map(Number);
    const pts=[]; let acc=0;
    seq.forEach((n,i)=>{
      const tick=n.tick||(DUR[n.key]||{tick:48}).tick;
      const el=svg.querySelector(`.snote[data-src="${i}"]`);
      const x=el?parseFloat(el.getAttribute('data-cx')):null;
      pts.push({t:(acc/T)*spb, x}); acc+=tick;
    });
    pts.push({t:(acc/T)*spb, x:vb[2]-16});   // 譜面右端
    for(let k=0;k<pts.length;k++){ if(pts[k].x==null) pts[k].x=(k>0?pts[k-1].x:vb[0]+20); }
    const line=document.createElementNS(SVGNS,'line');
    line.setAttribute('y1','7'); line.setAttribute('y2',String(vb[3]-7));
    line.setAttribute('stroke','var(--accent)'); line.setAttribute('stroke-width','2.4');
    line.setAttribute('stroke-linecap','round'); line.setAttribute('opacity','0.6');
    line.setAttribute('x1',String(pts[0].x)); line.setAttribute('x2',String(pts[0].x));
    svg.appendChild(line);
    return {line, pts};
  });
  const xAt=(pts,t)=>{ if(t<=pts[0].t) return pts[0].x;
    for(let k=0;k<pts.length-1;k++){ if(t<=pts[k+1].t){ const a=pts[k],b=pts[k+1],r=(t-a.t)/((b.t-a.t)||1); return a.x+(b.x-a.x)*r; } }
    return pts[pts.length-1].x; };
  let raf=null, startT=(window.performance&&performance.now?performance.now():Date.now()), done=false;
  const finish=()=>{ if(done) return; done=true; if(raf) cancelAnimationFrame(raf);
    bars.forEach(b=>{ if(b.line.parentNode) b.line.parentNode.removeChild(b.line); }); clearHL(); onDone&&onDone(); };
  const now=()=>(window.performance&&performance.now?performance.now():Date.now());
  const animate=()=>{ const el=(now()-startT)/1000 - lead; const tt=Math.max(0,el);
    bars.forEach(b=>{ const x=xAt(b.pts,tt); b.line.setAttribute('x1',String(x)); b.line.setAttribute('x2',String(x)); });
    if(el<total+0.15) raf=requestAnimationFrame(animate); };
  raf=requestAnimationFrame(animate);
  playSequence(seq, bpm, {
    accentFirst:true,
    onStep:(i)=>{ clearHL(); container.querySelectorAll(`.snote[data-src="${i}"]`).forEach(e=>e.classList.add('hl')); },
    onEnd:finish
  });
}

/* ---------- 汎用ユーティリティ ---------- */
const rnd = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

// 指定tick合計になる音符列をランダム生成（バックトラック）
function fillBar(targetTick, pool){
  const keys = pool || ['whole','half','dotHalf','quarter','dotQuarter','eighth','dotEighth','sixteenth'];
  const items = keys.map(k=>({k,tick:DUR[k].tick})).sort((a,b)=>b.tick-a.tick);
  const out=[];
  function bt(rem){
    if(rem===0) return true;
    for(const it of shuffle(items)){
      if(it.tick<=rem){ out.push(it.k); if(bt(rem-it.tick)) return true; out.pop(); }
    }
    return false;
  }
  bt(targetTick);
  return out;
}

// 拍子に合った1小節を生成する。
// 複合拍子(6/8)は「八分3つ＝1拍」のまとまりごとに埋め、拍のまとまりが崩れないようにする。
function fillBarSig(sig, pool){
  if(!isCompound(sig)) return fillBar(barTickOf(sig), pool);
  const unit = pulseTickOf(sig);                       // 72tick＝付点四分
  const usable = pool.filter(k=>DUR[k].tick<=unit);
  const use = usable.length ? usable : ['eighth','quarter','dotQuarter'];
  let out=[];
  for(let i=0;i<pulseCountOf(sig);i++){
    let g=fillBar(unit, use);
    if(!g.length) g=['dotQuarter'];
    out=out.concat(g);
  }
  return out;
}

/* ---- 直前の問題との重複回避 ----
   各モードのキー(mode番号など)ごとに直前の「署名」を覚えておき、
   gen() が同じ署名を返すあいだは作り直す（最大tries回）。 */
const _lastSig = {};
function uniqueGen(tag, gen, sig, tries=12){
  let result = gen();
  for(let i=0; i<tries && sig(result)===_lastSig[tag]; i++){
    result = gen();
  }
  _lastSig[tag] = sig(result);
  return result;
}

/* ============================================================
   状態
============================================================ */
const S={mode:8, lastPrac:0, score:0, total:0, streak:0, best:0, locked:false, diff:'normal', meter:'auto',
         data:null};   // 起動直後はホーム（HOME_MODE）

/* ============================================================
   ★ 全モード共通セッション（チャレンジ型・問数固定）
   ・1セッション＝5問（③リズム耳コピのみ4問）
   ・採点は正解数のみ／星は辛め：★3=満点 ★2=−1問 ★1=−2問
   ・難易度は選択＋微調整（2連続正解→+1段 / 2連続ミス→−1段）
============================================================ */
const DIFFS=['easy','normal','hard'];
const DIFF_LABEL={easy:'やさしい',normal:'ふつう',hard:'むずかしい'};
const BEST_KEY='nvt_session_best_v1';
let bestStars=(function(){ try{ return JSON.parse(localStorage.getItem(BEST_KEY)||'{}')||{}; }catch(e){ return {}; } })();
function saveBest(modeIdx, stars){
  const prev=bestStars[modeIdx]||0;
  if(stars>prev){ bestStars[modeIdx]=stars; try{ localStorage.setItem(BEST_KEY, JSON.stringify(bestStars)); }catch(e){} }
}
// セッション問数：①穴埋め=10問（デイリー）、③リズム耳コピ=4問、他5問
function sessionN(modeIdx){ return (MODES[modeIdx] && MODES[modeIdx].n) || 5; }
let SESS=null;

/* ============================================================
   ★ ①穴埋め＝デイリー（毎日1回・10問・表記なしで自動難化）
============================================================ */
// デイリーは複数モードで併用（穴埋め=fill／音価あて=value／名前あて=name）。モードごとに独立した状態を持つ。
const DAILY_KEYS={ fill:'nvt_fill_daily_v1', value:'nvt_value_daily_v1', name:'nvt_name_daily_v1', advanced:'nvt_advanced_daily_v1', listen:'nvt_listen_daily_v1', scale:'nvt_scale_daily_v1', police:'nvt_police_daily_v1' };
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function loadDaily(id){ try{ return JSON.parse(localStorage.getItem(DAILY_KEYS[id])||'{}')||{}; }catch(e){ return {}; } }
const DAILIES={}; for(const _id in DAILY_KEYS) DAILIES[_id]=loadDaily(_id);
function saveDaily(id){ try{ localStorage.setItem(DAILY_KEYS[id], JSON.stringify(DAILIES[id])); }catch(e){} }
// 今日の状態： 'done'（本日達成済み） / 'inprogress'（途中） / 'fresh'（未着手 or 新しい日）
function dailyState(id){
  const D=DAILIES[id]||{}, t=todayStr();
  if(D.date!==t) return 'fresh';
  if(D.done) return 'done';
  if(D.progress) return 'inprogress';
  return 'fresh';
}
function dailyBegin(id){ const D=DAILIES[id]; D.date=todayStr(); D.done=false; D.progress={i:0,correct:0,hist:[]}; saveDaily(id); }
function dailySaveProgress(){ if(!SESS||!SESS.daily) return; const D=DAILIES[SESS.dailyId]; if(!D) return; D.date=todayStr(); D.progress={i:SESS.i,correct:SESS.correct,hist:(SESS._hist||[]).slice()}; saveDaily(SESS.dailyId); }
function dailyComplete(id, correct, N, stars){
  const D=DAILIES[id], t=todayStr(), y=yesterdayStr();
  let streak = D.streak||0;
  if(D.lastDone===t){ /* 念のため二重加算防止 */ }
  else if(D.lastDone===y){ streak = streak+1; }
  else { streak = 1; }
  D.date=t; D.done=true; D.lastDone=t; D.streak=streak;
  D.correct=correct; D.N=N; D.stars=stars;
  if(!D.best || stars>D.best) D.best=stars;
  D.progress=null; saveDaily(id);
  return streak;
}
// 本日のデイリーを再挑戦（完了フラグ・途中経過のみ解除。連続日数・自己ベストは維持）。
// 再度クリアすると本日のスコア（正解数・星）は上書きされ、streakは二重加算されない。
function dailyRetry(id){
  const D=DAILIES[id]; D.done=false; D.progress=null; saveDaily(id);
  sessionStart();   // dailyState'fresh'→dailyBegin＋新セッション
  loadMode();
}
// 問番号(0-based)→出題ステージ（表記なしで静かに難化）
function fillStage(i){
  if(i<=2)  return {pool:['whole','half','quarter','eighth'], sig:[4,4], allowWhole:true};   // 序盤：素直な音価・4/4（全音符はここだけ・少しだけ）
  if(i<=6)  return {pool:['half','dotHalf','quarter','quarter','eighth','eighth'], sig:[4,4], allowWhole:false}; // 中盤：付点二分など・4/4
  // 終盤：付点四分/八分・十六分＋拍子変化（6/8が有効なら複合拍子も混ざる）
  return {pool:['half','dotHalf','quarter','dotQuarter','eighth','eighth','dotEighth','sixteenth'], sig:rnd(SIG_ALL()), allowWhole:false};
}

function sessionStart(){
  const M=MODES[S.mode];
  if(M && M.ref){ SESS=null; return; }
  const did = M && M.daily;   // このモードのデイリーid（無ければ通常セッション）
  if(did){
    const N = M.n||10;
    const st=dailyState(did);
    if(st==='done'){ SESS={active:false, mode:S.mode, N, i:0, correct:0, done:true, daily:true, dailyId:did, todayDone:true}; return; }
    if(st==='inprogress'){
      const p=DAILIES[did].progress||{i:0,correct:0,hist:[]};
      SESS={active:true, mode:S.mode, N, i:p.i||0, correct:p.correct||0, answered:false, done:false, cc:0, wc:0, _hist:(p.hist||[]).slice(), _last:false, daily:true, dailyId:did, _wholeAns:0};
      return;
    }
    dailyBegin(did);
    SESS={active:true, mode:S.mode, N, i:0, correct:0, answered:false, done:false, cc:0, wc:0, _hist:[], _last:false, daily:true, dailyId:did, _wholeAns:0};
    return;
  }
  SESS={active:true, mode:S.mode, N:sessionN(S.mode), i:0, correct:0, answered:false, done:false, cc:0, wc:0, _hist:[], _last:false};
}
// 難易度の微調整（±1段、範囲内でクランプ）
function bumpDiff(dir){
  const idx=DIFFS.indexOf(S.diff);
  const ni=Math.max(0, Math.min(DIFFS.length-1, idx+dir));
  if(ni!==idx){ S.diff=DIFFS[ni]; return true; }
  return false;
}
// 星判定（辛め）：満点=3／−1問=2／−2問=1／それ未満=0
function starsFor(correct, N){
  if(correct>=N) return 3;
  if(correct>=N-1) return 2;
  if(correct>=N-2) return 1;
  return 0;
}
// 回答直後に呼ばれ、セッションを進める（score から呼び出し）
function sessionRecord(ok){
  if(!SESS || !SESS.active || SESS.answered) return;
  SESS.answered=true;
  SESS._last=ok; SESS._hist[SESS.i]=ok;
  if(ok){ SESS.correct++; SESS.cc++; SESS.wc=0; } else { SESS.cc=0; SESS.wc++; }
  // 微調整（穴埋めデイリーでは行わない：難化は問番号カーブが担う）。他モードは2連続で±1段。
  let diffCh=null;
  if(!SESS.daily){
    if(SESS.cc>=2){ const from=S.diff; if(bumpDiff(+1)) diffCh={dir:1,from,to:S.diff}; SESS.cc=0; }
    else if(SESS.wc>=2){ const from=S.diff; if(bumpDiff(-1)) diffCh={dir:-1,from,to:S.diff}; SESS.wc=0; }
  }
  // 本番は連続正解をコンボとして積み上げるため、cc をリセットしない
  renderSessBar();
  birdReact(ok);
  if(diffCh) announceDiff(diffCh);
  renderSessionNext();
}
// 難易度が変わったことを、はっきり知らせる（トースト＋ラベル点滅＋ことりの声＋セレクタ反映）
function announceDiff(ch){
  const up = ch.dir>0;
  // ことりの吹き出しを上書き（ok/ng より難易度変化を優先）
  setBubble(up?`レベルアップ！むずかしくなるよ⤴`:`むずかしさを さげたよ⤵`, up?'ok':'ng');
  // セッションバーの難易度ラベルを点滅
  const lab=document.querySelector('.sess-diff'); if(lab){ lab.classList.remove('flash'); void lab.offsetWidth; lab.classList.add('flash'); }
  // 難易度セレクタの選択状態を即時反映
  const seg=hudR.querySelector('.seg');
  if(seg){ [...seg.children].forEach(btn=>btn.setAttribute('aria-pressed', btn.textContent===DIFF_LABEL[S.diff]?'true':'false')); }
  // カード上部にトースト表示
  const card=$('stageCard'); if(card){
    const old=card.querySelector('.difftoast'); if(old) old.remove();
    const t=document.createElement('div'); t.className='difftoast '+(up?'up':'down');
    t.innerHTML=`<span class="dt-ico">${up?'⤴':'⤵'}</span><span>むずかしさ <b>${DIFF_LABEL[ch.from]}</b> → <b>${DIFF_LABEL[ch.to]}</b></span>`;
    card.appendChild(t);
    requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>t.classList.remove('show'), 2200);
    setTimeout(()=>{ if(t.parentNode) t.remove(); }, 2700);
  }
}
// 進行ボタン：つぎの問題／結果を見る
function renderSessionNext(){
  ctrlEl.innerHTML='';
  ctrlEl.classList.add('afteranswer');   // 結果・理由を読んだあとに、少し遅れて現れる
  if(!SESS || !SESS.active){
    const n=mkBtn('つぎの問題 →','',()=>loadMode()); n.classList.add('wide'); ctrlEl.appendChild(n); return;
  }
  if(SESS.i < SESS.N-1){
    const b=mkBtn('つぎの問題 →','',()=>{ SESS.i++; SESS.answered=false; if(SESS.daily) dailySaveProgress(); loadMode(); });
    b.classList.add('wide'); ctrlEl.appendChild(b);
  }else{
    const b=mkBtn('結果を見る ★','accent',()=>sessionFinish());
    b.classList.add('wide'); ctrlEl.appendChild(b);
  }
}
// セッション集計→星→記録→オーバーレイ
function sessionFinish(){
  if(!SESS) return;
  const c=SESS.correct, N=SESS.N, stars=starsFor(c,N);
  SESS.done=true; SESS.active=false;
  applyTabState();
  if(stars>0) saveBest(SESS.mode, stars);
  if(SESS.daily){ dailyComplete(SESS.dailyId, c, N, stars); SESS.todayDone=true; buildTabs(); }
  birdFinish(stars);
  showSessionResult(SESS.mode, c, N, stars);
}
// 進捗バー（旧レベルパネル枠 #levelPanel を流用）
function renderSessBar(){
  const host=$('levelPanel'); if(!host) return;
  if(!SESS || !SESS.active){ host.innerHTML=''; return; }
  const cur = SESS.answered ? SESS.i : SESS.i;   // 現在問（0-based）
  let dots='';
  for(let k=0;k<SESS.N;k++){
    let cls='d';
    if(k<SESS.i) cls+= (SESS._hist&&SESS._hist[k]===false)?' ng':' ok';
    else if(k===SESS.i){ if(SESS.answered) cls+= (SESS._last?' ok':' ng'); else cls+=' now'; }
    dots+=`<span class="${cls}"></span>`;
  }
  if(SESS.dailyId==='advanced'){
    // 本番：残り問題数とコンボ（連続正解）を前に出す
    const remain = SESS.N - (SESS.answered ? SESS.i+1 : SESS.i);
    const combo = SESS.cc||0;
    host.innerHTML=
      `<div class="sessbar">
         <span class="qn"><span class="honban-tag">本番</span>第 <b>${Math.min(SESS.i+1,SESS.N)}</b> / ${SESS.N}</span>
         <span class="sess-dots">${dots}</span>
         <span class="remain">のこり <b>${Math.max(remain,0)}</b>問</span>
       </div>
       <div class="sessbar" style="margin-top:-6px;justify-content:center">
         <span class="combo${combo>=2?' on':''}" id="comboBox">${combo>=2?`🔥 <span class="cn">${combo}</span> れんぞく せいかい！`:'れんぞく せいかいで コンボ'}</span>
       </div>`;
    if(combo>=2){ const cb=$('comboBox'); if(cb){ void cb.offsetWidth; cb.classList.add('pop'); } }
    return;
  }
  host.innerHTML=
    SESS.daily
    ? `<div class="sessbar">
         <span class="qn">きょうの10問　第 <b>${Math.min(SESS.i+1,SESS.N)}</b> / ${SESS.N}</span>
         <span class="sess-dots">${dots}</span>
         <span class="sess-diff">🔥 <b>${(DAILIES[SESS.dailyId]||{}).streak||0}</b>日</span>
       </div>`
    : `<div class="sessbar">
         <span class="qn">第 <b>${Math.min(SESS.i+1,SESS.N)}</b> / ${SESS.N} 問</span>
         <span class="sess-dots">${dots}</span>
         <span class="sess-diff">むずかしさ <b>${DIFF_LABEL[S.diff]}</b></span>
       </div>`;
}
/* ---- ことり二羽の反応 ---- */
function setBubble(txt, cls){
  const b=$('birdBubble'), t=$('bubbleTxt'); if(!b||!t) return;
  t.textContent=txt;
  b.className='bubble'+(cls?(' '+cls):'');
  void b.offsetWidth; b.classList.add('pop');
}
const BUBBLE_DEFAULT='いっしょに 練習しよう！';
function resetBubble(){ const b=$('birdBubble'), t=$('bubbleTxt'); if(t) t.textContent=BUBBLE_DEFAULT; if(b) b.className='bubble'; }
function birdReact(ok){
  const g=$('birdGreen'), w=$('birdWhite'), cls=ok?'happy':'oops';
  [g,w].forEach(el=>{ if(!el)return; el.classList.remove('happy','oops'); void el.offsetWidth; el.classList.add(cls); });
  const okMsgs=['いいね！','その ちょうし！','せいかい！','じょうずだね！'];
  const ngMsgs=['おしい！','つぎは いけるよ','ドンマイ！','よく きいてみよう'];
  setBubble(ok?rnd(okMsgs):rnd(ngMsgs), ok?'ok':'ng');
}
function birdFinish(stars){
  const g=$('birdGreen'), w=$('birdWhite');
  [g,w].forEach(el=>{ if(!el)return; el.classList.remove('happy','oops'); void el.offsetWidth; if(stars>0) el.classList.add('happy'); });
  const msg = stars>=3?'ぜんもん せいかい！やったね！'
    : stars===2?'あと ちょっと！おしい！'

// 結果オーバーレイの紙ふぶき
function fcConfetti(){
  const cv=document.getElementById('fcConfetti'); if(!cv) return;
  const ctx=cv.getContext('2d'); const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#EF9F27','#BA7517','#1D9E75','#185FA5','#FFD54F'];
  const ps=[];
  for(let i=0;i<90;i++) ps.push({x:Math.random()*W,y:-20-Math.random()*H*0.3,
    vx:(Math.random()-0.5)*2,vy:2+Math.random()*3,w:6+Math.random()*6,h:8+Math.random()*8,
    col:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-0.5)*0.3});
  const dur=1600, t0=performance.now();
  (function loop(now){
    const el=now-t0; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-el/dur); ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(el<dur) requestAnimationFrame(loop); else ctx.clearRect(0,0,W,H);
  })(t0);
}

/* ============================================================
   ① 穴埋め：小節の空白を埋める音符を当てる
============================================================ */
function mFill(){
  modeHeader();
  // 本日ぶんを達成済みなら「また明日」画面
  if(SESS && SESS.todayDone){ renderDailyDone(SESS.dailyId); return; }
  // 問番号に応じたステージ（表記なしで静かに難化）。練習・デイリーとも同じ進み方。
  const qi = isMixedDaily() ? 8 : ((SESS && SESS.i!=null) ? SESS.i : 0);   // 上級は難ステージ固定
  const st = fillStage(qi);
  const sig = st.sig;
  const target = barTickOf(sig);
  const wholeAns = (SESS && SESS._wholeAns) || 0;
  const q = uniqueGen('fill', ()=>{
    const arr = fillBarSig(sig, st.pool);
    const idxAll = arr.map((k,idx)=>idx);
    const nonWhole = idxAll.filter(idx=>arr[idx]!=='whole');
    // 答え（空欄）が全音符になるのは序盤のみ・上限1回・かつ低確率
    const mayWhole = st.allowWhole && wholeAns<1 && Math.random()<0.25;
    let bi;
    if(!mayWhole && nonWhole.length){ bi = nonWhole[Math.floor(Math.random()*nonWhole.length)]; }
    else { bi = idxAll[Math.floor(Math.random()*idxAll.length)]; }
    return {full:arr, blankIdx:bi};
  }, r=>r.full.join('-')+'@'+r.blankIdx);
  const full=q.full, blankIdx=q.blankIdx, answerKey=full[blankIdx];
  if(answerKey==='whole' && SESS){ SESS._wholeAns=(SESS._wholeAns||0)+1; }
  const seq = full.map((k,i)=> i===blankIdx ? {key:k,blank:true,tick:DUR[k].tick} : {key:k,tick:DUR[k].tick});
  renderFill(seq, answerKey, blankIdx, target, sig);
}

// ①穴埋めの描画・採点（共通化）
function renderFill(seq, answerKey, blankIdx, target, sig){
  const meterSig = sig || [Math.round(target/T), 4];
  const tieOK = canTie(meterSig);             // 複合拍子は拍のまとめ方が異なるため分割表示しない
  promptEl.innerHTML=`<b>「?」の枠</b>に入る音符はどれ？ <span class="toollabel">（${meterSig[0]}/${meterSig[1]}拍子 ＝ ひと小節は${barLenLabel(meterSig)}）</span>`;
  bodyEl.innerHTML=`<div class="stage">${staffSVG(seq,{totalTick:target,meterSig,beam:false})}</div>`;
  const others = shuffle(Object.keys(DUR).filter(k=>k!==answerKey)).slice(0,3);
  const opts = shuffle([answerKey,...others]);
  renderChoices(opts, answerKey, (k,btn,correct)=>{
    if(correct){
      seq[blankIdx]={key:answerKey,tick:DUR[answerKey].tick,mark:'ok'};
      // 拍でまとめる（分割＋タイ）と見た目が変わる小節だけ、2段で対比（そのまま／まとめた形）
      const _exp=expandTies(seq, target);
      const _split=tieOK && ((_exp.length!==seq.length)||_exp.some(n=>n.tie));
      if(_split){
        bodyEl.innerHTML=
          `<div class="stage"><div class="toollabel" style="text-align:center;margin:0 0 2px">そのまま（きみが うめた かたち）</div>`
          +`${staffSVG(seq,{totalTick:target,meterSig,beam:true})}</div>`
          +`<div class="stage" style="margin-top:6px"><div class="toollabel" style="text-align:center;margin:0 0 2px">拍で まとめた かたち（ほんとうの 書きかた）</div>`
          +`${staffSVG(seq,{totalTick:target,meterSig,beam:true,tie:true})}</div>`;
      }else{
        bodyEl.innerHTML=`<div class="stage">${staffSVG(seq,{totalTick:target,meterSig,beam:true,tie:tieOK})}</div>`;
      }
      // ▶再生：譜面のリズムを鳴らし、再生位置バーをなめらかに滑らせ、通過する音符も光らせる（2段連動）
      const pbtn=mkBtn('▶ 再生','accent',()=>{
        pbtn.disabled=true;
        playStaffBar(seq, 84, bodyEl, ()=>{ pbtn.disabled=false; });
      });
      pbtn.style.marginTop='8px';
      const pwrap=document.createElement('div'); pwrap.style.textAlign='center'; pwrap.appendChild(pbtn);
      bodyEl.appendChild(pwrap);
      showFB(true, DUR[answerKey].name, `${beatStr(DUR[answerKey].tick)}で小節が満ちました`);
    }else{
      showFB(false, '', `正解は ${DUR[answerKey].name}（${beatStr(DUR[answerKey].tick)}）でした`);
    }
  },{withGlyph:true,cols:2});

  nextBtn();
}

/* 選択肢レンダリング共通 */
function renderChoices(keys, answerKey, cb, opt={}){
  const box=document.createElement('div');
  box.className='choices '+(opt.cols===3?'cols3':'cols2');
  keys.forEach((k,i)=>{
    const b=document.createElement('button'); b.className='opt';
    let inner=`<span class="num">${i+1}</span>`;
    if(opt.withGlyph){ inner+=noteGlyph(k,{w:30,h:40}); }
    inner+=`<span>${DUR[k].name}</span>`;
    b.innerHTML=inner;
    b.onclick=()=>{
      if(S.locked) return; S.locked=true;
      const correct = k===answerKey;
      Array.from(box.children).forEach((c,j)=>{
        if(keys[j]===answerKey) c.classList.add('correct');
        else if(j===i) c.classList.add('wrong');
        else c.classList.add('dim');
      });
      score(correct);
      cb&&cb(k,b,correct);
    };
    box.appendChild(b);
  });
  bodyEl.appendChild(box);
}

   ② 音符あて：表示された音符の名称／拍数を答える
============================================================ */
// ②音価あて／③名前あて（いずれもデイリー）
// kind='value'（音価＝長さを問う）／'name'（名前を問う）。
// 問番号で静かに難化：序盤〜中盤は主題のみ、終盤（8問目〜）は名前と長さの両方を問う。
function nqStage(qi){
  if(qi<=1) return {pool:['whole','half','quarter','eighth']};                                     // やさしい（2問）
  if(qi<=3) return {pool:['whole','half','dotHalf','quarter','eighth']};                            // 中くらい（2問）：付点二分
  return {pool:['whole','half','dotHalf','quarter','dotQuarter','eighth','dotEighth','sixteenth']}; // 難しい（2問）：付点四分・付点八分・十六分
}
// セッション内で「答え」が重複しない出題列を作る。
//   音価あて：長さ（tick）が重複しない／名前あて：名前（音符key＋休符か）が重複しない。
function nqBuild(kind, N){
  const used=new Set();
  const uniq=(key,isRest)=> kind==='value' ? ('t'+DUR[key].tick) : (key+'|'+(isRest?'r':'n'));
  const list=[];
  for(let i=0;i<N;i++){
    const pool=nqStage(i).pool;
    let q, tries=0;
    do{ q={key:rnd(pool), isRest:Math.random()<0.28}; tries++; }
    while(used.has(uniq(q.key,q.isRest)) && tries<60);
    used.add(uniq(q.key,q.isRest));
    list.push(q);
  }
  return list;
}
function mNoteQuiz(kind){
  modeHeader();
  // 本日ぶんを達成済みなら「また明日」画面
  if(SESS && SESS.todayDone){ renderDailyDone(SESS.dailyId); return; }
  // セッション開始時に、答えが重複しない出題列を一度だけ用意（上級デイリーでは使わない）
  if(SESS && SESS.daily && !SESS.nqList && !isMixedDaily()){ SESS.nqList = nqBuild(kind, SESS.N||6); }
  const qi = (SESS && SESS.daily) ? SESS.i : 0;
  const q = (!isMixedDaily() && SESS && SESS.nqList && SESS.nqList[qi])
              ? SESS.nqList[qi]
              : { key: rnd(nqStage(isMixedDaily()?5:qi).pool), isRest: Math.random()<0.28 };
  const isRest=q.isRest, key=q.key, ans=DUR[key].tick;
  const nameOf = k => isRest ? DUR[k].name.replace('音符','休符') : DUR[k].name;

  bodyEl.innerHTML=`<div class="stage" style="padding:22px 8px">
    ${noteGlyph(key,{w:70,h:80, rest:isRest})}</div>`;

  const tickAll=[192,144,96,72,48,36,24,12];
  const makeTickKeys=()=>{ const cand=new Set([ans]); while(cand.size<4){ cand.add(rnd(tickAll)); } return shuffle([...cand]); };
  const makeNameKeys=()=>{ const others=shuffle(Object.keys(DUR).filter(k=>k!==key)).slice(0,3); return shuffle([key,...others]); };

  const box=document.createElement('div'); box.className='choices cols2';
  if(kind==='value'){
    promptEl.innerHTML=`この${isRest?'休符':'音符'}の長さは？ <span class="toollabel">（4分音符＝1拍）</span>`;
    const keys=makeTickKeys();
    keys.forEach((tk,i)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML=`<span class="num">${i+1}</span><span>${beatStr(tk)}</span>`;
      b.onclick=()=>{
        if(S.locked)return; S.locked=true;
        const ok=tk===ans;
        Array.from(box.children).forEach((c,j)=>{ if(keys[j]===ans)c.classList.add('correct'); else if(j===i)c.classList.add('wrong'); else c.classList.add('dim'); });
        score(ok);
        showFB(ok, nameOf(key), `${beatStr(ans)}`);
      };
      box.appendChild(b);
    });
  }else{
    promptEl.innerHTML=`この${isRest?'休符':'音符'}の名前は？`;
    const keys=makeNameKeys();
    keys.forEach((k,i)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML=`<span class="num">${i+1}</span><span>${nameOf(k)}</span>`;
      b.onclick=()=>{
        if(S.locked)return; S.locked=true;
        const ok=k===key;
        Array.from(box.children).forEach((c,j)=>{ if(keys[j]===key)c.classList.add('correct'); else if(j===i)c.classList.add('wrong'); else c.classList.add('dim'); });
        score(ok);
        showFB(ok, '', `${nameOf(key)}・${beatStr(ans)}`);
      };
      box.appendChild(b);
    });
  }
  bodyEl.appendChild(box);
  nextBtn();
}

/* ============================================================
   ③ リズム耳コピ：クリックを聴いて音符を並べ再現
============================================================ */
function mListen(){
  if(SESS && SESS.todayDone){ renderDailyDone(SESS.dailyId); return; }
  const bpm=76;
  const sig=sigFromMeter();
  const beatsTotal=barTickOf(sig)/T;
  const pool = isMixedDaily()? ADV_POOL : ((S.diff==='easy')?['quarter','half','eighth']:poolByDiff());
  const answer = uniqueGen('listen', ()=>
    fillBarSig(sig, pool).filter(k=>DUR[k].tick<=DUR['whole'].tick),
    seq=>seq.join('-'));
  const target = barTickOf(sig);
  S.data={answer, target, placed:[], bpm, beats:answer.reduce((s,k)=>s+DUR[k].tick,0)/T, playing:false,
          meterSig:sig, sig,
          // カウントは「拍」の単位。拍が2つしかない拍子(2/4・6/8)は2小節ぶん数えて、
          // 最後の1拍を空ける「間」が作れるようにする。
          countN:(pulseCountOf(sig)<3 ? pulseCountOf(sig)*2 : pulseCountOf(sig)),

  modeHeader();
  hudR.appendChild(meterSeg());   // 拍子セグメント
